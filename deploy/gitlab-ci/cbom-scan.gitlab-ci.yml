# CipherRadar CBOM Scan -- GitLab CI Template
#
# Usage: Include this template in your .gitlab-ci.yml:
#   include:
#     - project: 'nk-sentinel/cipherradar'
#       ref: main
#       file: 'deploy/gitlab-ci/cbom-scan.gitlab-ci.yml'

variables:
  CBOM_FORMAT: "cyclonedx-json"
  CBOM_OUTPUT: "cbom.json"
  CBOM_PASSES: "1"
  CBOM_POLICY: ""
  CBOM_FAIL_ON: ""
  CBOM_SARIF_OUTPUT: "cbom.sarif"

.cbom-scan-base:
  image: golang:1.22
  before_script:
    - cd cli && go build -o /usr/local/bin/cbom ./cmd/cbom && cd ..

cbom-scan:
  extends: .cbom-scan-base
  stage: test
  script:
    - cbom scan . --format ${CBOM_FORMAT} --output ${CBOM_OUTPUT} --passes ${CBOM_PASSES}
    - cbom scan . --format text --passes ${CBOM_PASSES}
    # Generate SARIF for GitLab Security Dashboard
    - cbom scan . --format sarif --output ${CBOM_SARIF_OUTPUT} --passes ${CBOM_PASSES}
    # Policy check (optional)
    - |
      if [ -n "${CBOM_POLICY}" ]; then
        FAIL_FLAG=""
        if [ -n "${CBOM_FAIL_ON}" ]; then
          FAIL_FLAG="--fail-on ${CBOM_FAIL_ON}"
        fi
        cbom policy check ${CBOM_OUTPUT} --policy ${CBOM_POLICY} ${FAIL_FLAG}
      fi
  artifacts:
    paths:
      - ${CBOM_OUTPUT}
      - ${CBOM_SARIF_OUTPUT}
    reports:
      sast: ${CBOM_SARIF_OUTPUT}
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
