{{- if not .Values.jwt.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cipherradar.secretName" . }}
  namespace: {{ include "cipherradar.namespace" . }}
  labels:
    {{- include "cipherradar.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret-key: {{ required "jwt.secretKey is required (set jwt.secretKey or jwt.existingSecret)" .Values.jwt.secretKey | b64enc | quote }}
  {{- if and .Values.postgresql.enabled .Values.postgresql.auth.password }}
  db-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.postgresql.enabled) .Values.externalDatabase.password }}
  db-password: {{ .Values.externalDatabase.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.externalS3.accessKey }}
  s3-access-key: {{ .Values.externalS3.accessKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.externalS3.secretKey }}
  s3-secret-key: {{ .Values.externalS3.secretKey | b64enc | quote }}
  {{- end }}
{{- end }}
