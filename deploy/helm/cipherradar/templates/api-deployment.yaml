apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cipherradar.fullname" . }}-api
  namespace: {{ include "cipherradar.namespace" . }}
  labels:
    {{- include "cipherradar.api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "cipherradar.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cipherradar.api.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "cipherradar.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "cipherradar.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ include "cipherradar.apiImageTag" . }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: CBOM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jwt.existingSecret | default (include "cipherradar.secretName" .) }}
                  key: db-password
            - name: CBOM_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jwt.existingSecret | default (include "cipherradar.secretName" .) }}
                  key: {{ .Values.jwt.existingSecretKey | default "jwt-secret-key" }}
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "cipherradar.fullname" . }}
            {{- with .Values.api.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
