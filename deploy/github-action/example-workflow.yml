# Example: Add to .github/workflows/cradar-scan.yml
name: CipherRadar Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cradar-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run CipherRadar Scan
        uses: ./deploy/github-action
        with:
          format: cyclonedx-json
          output: cbom.json
          passes: '1'
          upload-artifact: 'true'

      # Optional: enforce policy
      # - name: Run CipherRadar Scan with Policy
      #   uses: ./deploy/github-action
      #   with:
      #     policy: policy.cradar.yml
      #     fail-on: high
