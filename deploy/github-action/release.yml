name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Build native binaries on each OS — avoids cgo cross-compilation issues
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            opengrep_arch: linux-x86_64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            opengrep_arch: linux-aarch64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            opengrep_arch: darwin-arm64
          - os: macos-13
            goos: darwin
            goarch: amd64
            opengrep_arch: darwin-x86_64
          - os: windows-latest
            goos: windows
            goarch: amd64
            opengrep_arch: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build cradar binary
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          go generate ./internal/rules
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags "-s -w \
            -X github.com/nk-sentinel/cipherradar/cli/internal/cmd.Version=${GITHUB_REF_NAME#v} \
            -X github.com/nk-sentinel/cipherradar/cli/internal/cmd.Commit=${GITHUB_SHA::8} \
            -X github.com/nk-sentinel/cipherradar/cli/internal/cmd.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "../dist/cradar${EXT}" ./cmd/cradar
        shell: bash

      - name: Download OpenGrep for bundling
        run: |
          OPENGREP_VERSION="v1.102.0"
          mkdir -p dist/opengrep
          curl -sL "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep-${OPENGREP_VERSION}-${{ matrix.opengrep_arch }}.tar.gz" | \
            tar -xz -C dist/opengrep/ opengrep 2>/dev/null || \
            echo "Warning: OpenGrep not available for ${{ matrix.opengrep_arch }}"
        shell: bash

      - name: Package cradar (lightweight)
        run: |
          mkdir -p dist/cradar-pkg
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          cp dist/cradar${EXT} dist/cradar-pkg/
          cd dist/cradar-pkg
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "../cradar_${{ matrix.goos }}_${{ matrix.goarch }}.zip" .
          else
            tar czf "../cradar_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" .
          fi
        shell: bash

      - name: Package cradar-full (with OpenGrep)
        run: |
          mkdir -p dist/cradar-full-pkg
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          cp dist/cradar${EXT} dist/cradar-full-pkg/
          if [ -f dist/opengrep/opengrep ]; then
            cp dist/opengrep/opengrep dist/cradar-full-pkg/
          fi
          cd dist/cradar-full-pkg
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "../cradar-full_${{ matrix.goos }}_${{ matrix.goarch }}.zip" .
          else
            tar czf "../cradar-full_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" .
          fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/cradar_*
            dist/cradar-full_*

  # Collect all platform artifacts and create a GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum cradar_* cradar-full_* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/cradar_*
            dist/cradar-full_*
            dist/checksums.txt
