apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cipherradar-api
  namespace: cipherradar-staging
  labels:
    app.kubernetes.io/name: cipherradar
    app.kubernetes.io/component: api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: api.staging.cipherradar.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cipherradar-api
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cipherradar-frontend
  namespace: cipherradar-staging
  labels:
    app.kubernetes.io/name: cipherradar
    app.kubernetes.io/component: frontend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: staging.cipherradar.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cipherradar-frontend
                port:
                  number: 3000
