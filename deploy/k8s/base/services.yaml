---
apiVersion: v1
kind: Service
metadata:
  name: cipherradar-api
  namespace: cipherradar
  labels:
    app.kubernetes.io/name: cipherradar
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: cipherradar
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: cipherradar-frontend
  namespace: cipherradar
  labels:
    app.kubernetes.io/name: cipherradar
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: cipherradar
    app.kubernetes.io/component: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: cipherradar-redis
  namespace: cipherradar
  labels:
    app.kubernetes.io/name: cipherradar
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: cipherradar
    app.kubernetes.io/component: redis
