apiVersion: apps/v1
kind: Deployment
metadata:
  name: cipherradar-scanner-worker
  namespace: cipherradar
  labels:
    app.kubernetes.io/name: cipherradar
    app.kubernetes.io/component: scanner-worker
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: cipherradar
      app.kubernetes.io/component: scanner-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cipherradar
        app.kubernetes.io/component: scanner-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: scanner-worker
          image: ghcr.io/nk-sentinel/cipherradar-api:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          command: ["python", "-m", "taskiq", "worker", "app.worker:broker"]
          envFrom:
            - configMapRef:
                name: cipherradar
            - secretRef:
                name: cipherradar
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os; os.getpid()"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import os; os.getpid()"
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
