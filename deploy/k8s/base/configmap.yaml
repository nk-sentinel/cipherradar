apiVersion: v1
kind: ConfigMap
metadata:
  name: cipherradar
  namespace: cipherradar
  labels:
    app.kubernetes.io/name: cipherradar
data:
  CRADAR_DATABASE_URL: "postgresql+asyncpg://postgres:$(CRADAR_DB_PASSWORD)@cipherradar-postgresql:5432/cipherradar"
  CRADAR_REDIS_URL: "redis://cipherradar-redis:6379"
