services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_DB: cipherradar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    environment:
      CBOM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/cipherradar
      CBOM_REDIS_URL: redis://redis:6379
      CBOM_JWT_SECRET_KEY: dev-secret-change-in-production
      CBOM_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  pgdata:
