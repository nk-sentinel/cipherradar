rules:
  - id: cbom-ruby-hardcoded-key
    message: >
      Hardcoded string literal flows into OpenSSL::Cipher key assignment.
      Hardcoded keys are extractable from source code and should be loaded
      from environment variables or a secrets manager.
    severity: ERROR
    languages: [ruby]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive: SYMMETRIC-KEY
      confidence: high
      quantum-relevant: true
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          $CIPHER = OpenSSL::Cipher.new(...)
          ...
          $CIPHER.key = "..."
      - pattern: |
          $CIPHER = OpenSSL::Cipher::AES.new(...)
          ...
          $CIPHER.key = "..."
      - pattern: |
          $KEY = "..."
          ...
          $CIPHER.key = $KEY

  - id: cbom-ruby-weak-digest-md5
    message: >
      Digest::MD5 is cryptographically broken and must not be used for
      integrity or authentication. Use Digest::SHA256 or Digest::SHA512.
    severity: ERROR
    languages: [ruby]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: MD5
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: Digest::MD5.hexdigest(...)
      - pattern: Digest::MD5.digest(...)
      - pattern: Digest::MD5.new
      - pattern: OpenSSL::Digest::MD5.new

  - id: cbom-ruby-weak-digest-sha1
    message: >
      Digest::SHA1 is considered cryptographically weak. Use
      Digest::SHA256 or Digest::SHA512.
    severity: WARNING
    languages: [ruby]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: SHA-1
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: Digest::SHA1.hexdigest(...)
      - pattern: Digest::SHA1.digest(...)
      - pattern: Digest::SHA1.new

  - id: cbom-ruby-insecure-ssl
    message: >
      SSL verification disabled by setting verify_mode to VERIFY_NONE.
      This allows man-in-the-middle attacks by accepting any certificate.
      Always use OpenSSL::SSL::VERIFY_PEER in production.
    severity: ERROR
    languages: [ruby]
    metadata:
      category: security
      cbom-asset-type: protocol
      cbom-primitive: TLS
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: |
          $CTX = OpenSSL::SSL::SSLContext.new
          ...
          $CTX.verify_mode = OpenSSL::SSL::VERIFY_NONE
      - pattern: |
          $HTTP.verify_mode = OpenSSL::SSL::VERIFY_NONE
      - pattern: |
          $OBJ.ssl_context.verify_mode = OpenSSL::SSL::VERIFY_NONE

  # ── CBOM Inventory Rules ──

  - id: cbom-ruby-crypto-library-import
    message: Cryptographic library require detected in Ruby.
    severity: INFO
    languages: [ruby]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-LIBRARY-IMPORT
      cbom-library: openssl-or-bcrypt-or-digest-or-jwt-rb-or-rbnacl
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: require 'openssl'
      - pattern: require 'bcrypt'
      - pattern: require 'digest'
      - pattern: require 'jwt'
      - pattern: require 'rbnacl'

  - id: cbom-ruby-password-hash-inventory
    message: Password hashing detected in Ruby.
    severity: INFO
    languages: [ruby]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: BCRYPT
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: BCrypt::Password.create($PASSWORD)
