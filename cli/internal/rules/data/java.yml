rules:
  - id: cbom-java-hardcoded-key-to-secretkeyspec
    message: >
      Hardcoded cryptographic key detected flowing into SecretKeySpec.
      Hardcoded keys are extractable from compiled bytecode and should
      be loaded from secure key stores or environment variables.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive: SYMMETRIC-KEY
      confidence: high
      quantum-relevant: false
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          byte[] $KEY = new byte[] { ... };
          ...
          new SecretKeySpec($KEY, ...);
      - pattern: |
          String $KEY = "...";
          ...
          new SecretKeySpec($KEY.getBytes(...), ...);

  - id: cbom-java-hardcoded-iv
    message: >
      Static initialization vector (IV) detected. IVs must be randomly
      generated for each encryption operation to prevent pattern leakage.
    severity: WARNING
    languages: [java]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive: INITIALIZATION-VECTOR
      confidence: high
      quantum-relevant: false
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          byte[] $IV = new byte[] { ... };
          ...
          new IvParameterSpec($IV);
      - pattern: |
          new IvParameterSpec("...".getBytes(...));

  - id: cbom-java-weak-prng-security
    message: >
      java.util.Random used in security-sensitive context. Use
      java.security.SecureRandom for cryptographic operations.
    severity: WARNING
    languages: [java]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: WEAK-PRNG
      confidence: medium
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: |
      Random $R = new Random(...);
      ...
      $R.nextBytes($ARG);

  - id: cbom-java-trust-all-certificates
    message: >
      Custom X509TrustManager that trusts all certificates detected.
      This disables certificate validation and enables MITM attacks.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cbom-asset-type: certificate
      cbom-primitive: CERTIFICATE-X509
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: |
      new X509TrustManager() {
        ...
        public void checkClientTrusted(...) { }
        ...
      }

  - id: cbom-java-hostname-verifier-bypass
    message: >
      HostnameVerifier that accepts all hostnames detected. This
      disables hostname verification and enables MITM attacks.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cbom-asset-type: protocol
      cbom-primitive: TLS
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: |
      new HostnameVerifier() {
        ...
        public boolean verify(...) { return true; }
        ...
      }

  - id: cbom-java-ecb-mode-usage
    message: >
      ECB mode used for block cipher. ECB does not provide semantic
      security — identical plaintext blocks produce identical ciphertext.
    severity: WARNING
    languages: [java]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: AES-ECB
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: Cipher.getInstance("=~/.*ECB.*/")

  - id: cbom-java-ec-curve-from-ecgenparameterspec
    message: >
      EC key generation with named curve detected via ECGenParameterSpec.
      The curve parameter determines the key strength and quantum vulnerability.
    severity: INFO
    languages: [java]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: ECDSA
      cbom-primitive-curve-from-metavar: $CURVE
      confidence: high
      quantum-relevant: true
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: |
          $KPG = KeyPairGenerator.getInstance("EC");
          ...
          $KPG.initialize(new ECGenParameterSpec("$CURVE"));
      - pattern: |
          KeyPairGenerator $KPG = KeyPairGenerator.getInstance("EC");
          ...
          $KPG.initialize(new ECGenParameterSpec("$CURVE"));
      - pattern: |
          $KPG.initialize(new ECGenParameterSpec("$CURVE"));

  # ── CBOM Inventory Rules (not vulnerability detection) ──

  - id: cbom-java-crypto-library-import
    message: >
      Cryptographic library import detected. This library is part of the
      project's cryptographic supply chain.
    severity: INFO
    languages: [java]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-LIBRARY-IMPORT
      cbom-library: bouncycastle-or-jca
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: import org.bouncycastle.$X;
      - pattern: import javax.crypto.$X;
      - pattern: import java.security.$X;
      - pattern: import javax.net.ssl.$X;
      - pattern: import org.bouncycastle.$X.$Y;
      - pattern: import javax.crypto.$X.$Y;
      - pattern: import java.security.$X.$Y;
      - pattern: import javax.net.ssl.$X.$Y;

  - id: cbom-java-kdf-to-cipher-chain
    message: >
      Key derivation chain detected: password-based key derivation feeds
      into cipher initialization. CBOM links KDF to cipher usage.
    severity: INFO
    languages: [java]
    metadata:
      category: inventory
      cbom-asset-type: key-derivation-function
      cbom-primitive-from-metavar: $ALGO
      cbom-primitive-fallback: PBKDF2
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: |
          SecretKeyFactory $F = SecretKeyFactory.getInstance("$ALGO");
          ...
          $KEY = $F.generateSecret($SPEC);
          ...
          $CIPHER.init($MODE, $KEY);

  - id: cbom-java-tls-version-enforcement
    message: >
      TLS version enforcement detected. CBOM records which protocol
      versions are explicitly permitted.
    severity: INFO
    languages: [java]
    metadata:
      category: inventory
      cbom-asset-type: protocol
      cbom-primitive: TLS
      cbom-primitive-from-metavar: $VERSION
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: |
          SSLContext $CTX = SSLContext.getInstance("$VERSION");
          ...
          $CTX.init($KM, $TM, $RANDOM);

  - id: cbom-java-keygen-to-cipher
    message: >
      Key generation flows into cipher initialization. CBOM links key
      creation to key consumption.
    severity: INFO
    languages: [java]
    metadata:
      category: inventory
      cbom-asset-type: related-crypto-material
      cbom-primitive-from-metavar: $ALGO
      cbom-primitive-fallback: SYMMETRIC-KEY
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: |
          KeyGenerator $KG = KeyGenerator.getInstance("$ALGO");
          ...
          $KEY = $KG.generateKey();
          ...
          $CIPHER.init($MODE, $KEY);

  - id: cbom-java-config-driven-algorithm
    message: >
      Cryptographic algorithm name loaded from configuration and passed
      to crypto API. CBOM tracks configuration-driven crypto.
    severity: INFO
    languages: [java]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive-from-metavar: $ALGO
      cbom-primitive-fallback: CONFIG-DRIVEN-ALGORITHM
      confidence: medium
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: |
          $ALGO = $PROPS.getProperty("$KEY");
          ...
          Cipher.getInstance($ALGO);
      - pattern: |
          $ALGO = System.getenv("$KEY");
          ...
          Cipher.getInstance($ALGO);

  - id: cbom-java-cert-to-tls-context
    message: >
      Certificate loaded and used in TLS context. CBOM links certificate
      assets to protocol configuration.
    severity: INFO
    languages: [java]
    metadata:
      category: inventory
      cbom-asset-type: certificate
      cbom-primitive: CERTIFICATE-X509
      confidence: high
      quantum-relevant: true
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: |
          KeyStore $KS = KeyStore.getInstance("$TYPE");
          ...
          $KS.load($INPUT, $PASS);
          ...
          TrustManagerFactory $TMF = TrustManagerFactory.getInstance("$ALGO");
          ...
          $TMF.init($KS);

  - id: cbom-java-crypto-provider-registration
    message: >
      Cryptographic provider registered. This changes which implementation
      backs subsequent crypto operations.
    severity: INFO
    languages: [java]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-PROVIDER-REGISTRATION
      cbom-library-from-metavar: $PROVIDER
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: Security.addProvider(new $PROVIDER());
      - pattern: Security.insertProviderAt(new $PROVIDER(), $POS);
