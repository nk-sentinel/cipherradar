  - id: cbom-java-crypto-provider-registration
    message: >
      Cryptographic provider registered. This changes which implementation
      backs subsequent crypto operations.
    severity: INFO
    languages: [java]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-PROVIDER-REGISTRATION
      cbom-library-from-metavar: $PROVIDER
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: Security.addProvider(new $PROVIDER());
      - pattern: Security.insertProviderAt(new $PROVIDER(), $POS);
