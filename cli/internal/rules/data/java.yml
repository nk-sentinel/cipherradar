      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: new GOST3411Digest(...)
      - pattern: new GOST3411_2012_256Digest(...)
      - pattern: new GOST3411_2012_512Digest(...)
      - pattern: MessageDigest.getInstance("GOST3411")
      - pattern: MessageDigest.getInstance("GOST3411-2012-256")
      - pattern: MessageDigest.getInstance("GOST3411-2012-512")

  # ── JCA cipher inventory (Phase A2) ──
  #
  # Captures every Cipher.getInstance("<spec>") and KeyGenerator.getInstance(...)
  # so the cipher-spec string flows through cbom-primitive-from-metavar
  # into the canonicalizer (which already understands DES/CBC, DESede, RC4,
  # Blowfish, RSA/ECB, AES/GCM, etc). Replaces the previous reliance on the
  # library-import rule alone, which emitted no algorithm token at all.

  - id: cbom-java-jca-cipher-getinstance
    message: "JCA Cipher.getInstance() cipher-spec detected"
    severity: INFO
    languages: [java]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive-from-metavar: $ALGO
      cbom-primitive-fallback: SYMMETRIC-CIPHER
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: Cipher.getInstance("$ALGO")

  - id: cbom-java-jca-keygenerator-getinstance
    message: "JCA KeyGenerator.getInstance() algorithm detected"
    severity: INFO
    languages: [java]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive-from-metavar: $ALGO
      cbom-primitive-fallback: SYMMETRIC-KEY
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: KeyGenerator.getInstance("$ALGO")

  # ── BouncyCastle engine inventory (Phase A2) ──
  #
  # Per-algorithm rules so the CBOM names the specific cipher (DES, RC4,
  # IDEA, etc) rather than relying on the catchall library-import rule.

  - id: cbom-java-bc-des-engine
    message: "DES cipher engine detected (broken)"
    severity: WARNING
    languages: [java]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: DES
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: new DESEngine(...)

  - id: cbom-java-bc-triple-des-engine
