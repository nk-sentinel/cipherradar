rules:
  - id: cbom-csharp-hardcoded-key-aes
    message: >
      Hardcoded byte array assigned to Aes.Key property. Cryptographic
      keys must not be embedded in source code — load them from secure
      key vaults or configuration providers.
    severity: ERROR
    languages: [csharp]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive: AES
      confidence: high
      quantum-relevant: true
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          byte[] $KEY = new byte[] { ... };
          ...
          $AES.Key = $KEY;
      - pattern: |
          $AES.Key = new byte[] { ... };

  - id: cbom-csharp-weak-rng
    message: >
      System.Random is not cryptographically secure. Use
      System.Security.Cryptography.RandomNumberGenerator for generating
      keys, nonces, tokens, or any security-sensitive random values.
    severity: WARNING
    languages: [csharp]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: WEAK-PRNG
      confidence: medium
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: new Random(...)
      - pattern: |
          Random $R = new Random(...);
          ...
          $R.NextBytes($ARG);

  - id: cbom-csharp-ecb-mode
    message: >
      ECB cipher mode detected. ECB does not provide semantic security —
      identical plaintext blocks produce identical ciphertext. Use CBC,
      GCM, or another authenticated mode instead.
    severity: WARNING
    languages: [csharp]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: AES-ECB
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: $AES.Mode = CipherMode.ECB
      - pattern: $ALGO.Mode = CipherMode.ECB

  # ── CBOM Inventory Rules ──

  - id: cbom-csharp-crypto-library-import
    message: Cryptographic library import detected in C# source.
    severity: INFO
    languages: [csharp]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-LIBRARY-IMPORT
      cbom-library: dotnet-cryptography
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: using System.Security.Cryptography;
      - pattern: using System.Net.Security;

  # ── .NET legacy symmetric ciphers (Phase A2) ──

  - id: cbom-csharp-des-cipher
    message: "DES cipher detected (broken)"
    severity: WARNING
    languages: [csharp]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: DES
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: DES.Create(...)
      - pattern: new DESCryptoServiceProvider(...)

  - id: cbom-csharp-3des-cipher
    message: "3DES (TripleDES) cipher detected"
    severity: WARNING
    languages: [csharp]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: 3DES
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: TripleDES.Create(...)
      - pattern: new TripleDESCryptoServiceProvider(...)

  - id: cbom-csharp-rc2-cipher
    message: "RC2 cipher detected (legacy)"
    severity: WARNING
    languages: [csharp]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: RC2
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: RC2.Create(...)
      - pattern: new RC2CryptoServiceProvider(...)

  - id: cbom-csharp-password-hash-inventory
    message: Password hashing detected in C#.
    severity: INFO
    languages: [csharp]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: PBKDF2
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: new Rfc2898DeriveBytes($PASSWORD, $SALT, $ITERATIONS)
      - pattern: new Rfc2898DeriveBytes($PASSWORD, $SALT, $ITERATIONS, $HASH)
