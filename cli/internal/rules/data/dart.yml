rules:
  - id: cbom-dart-hardcoded-key
    message: >
      Hardcoded string literal flows into AES key construction. Hardcoded
      keys are extractable from application bundles and should be loaded
      from a secure key store or server-side configuration.
    severity: ERROR
    languages: [dart]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive: AES
      confidence: high
      quantum-relevant: true
      maturity: experimental
      default_enabled: false
      noise_risk: high
    # rc2-bug7: simplified — opengrep v1.16.5 dart parser cannot tokenise
    # multi-statement patterns (binding + ellipsis + call chain). Restore the
    # cross-statement key-flow pattern when opengrep dart support improves.
    pattern-either:
      - pattern: Key.fromUtf8("...")
      - pattern: Key.fromBase64("...")
      - pattern: Key(Uint8List.fromList([...]))

  - id: cbom-dart-weak-hash-md5
    message: >
      MD5 hash function detected via crypto package. MD5 is
      cryptographically broken and must not be used for integrity or
      authentication. Use sha256 or sha512 from the crypto package.
    severity: ERROR
    languages: [dart]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: MD5
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: md5.convert(...)
      - pattern: Hmac(md5, ...).convert(...)
      - pattern: |
          var $DIGEST = md5.convert(...);
      - pattern: |
          final $DIGEST = md5.convert(...);

  - id: cbom-dart-weak-hash-sha1
    message: >
      SHA-1 hash function detected via crypto package. SHA-1 is
      considered cryptographically weak and must not be used for new
      protocols. Use sha256 or sha512 from the crypto package.
    severity: WARNING
    languages: [dart]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: SHA-1
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: sha1.convert(...)

  - id: cbom-dart-insecure-random
    message: >
      dart:math Random used for generating values in a security context.
      The default Random is not cryptographically secure. Use
      Random.secure() for cryptographic random number generation.
    severity: WARNING
    languages: [dart]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: WEAK-PRNG
      confidence: medium
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    # rc2-bug7: simplified — opengrep v1.16.5 dart parser cannot tokenise
    # multi-statement binding-then-use patterns. Falls back to direct
    # Random() construction/usage matches. Restore cross-statement flow
    # patterns when opengrep dart support improves.
    pattern-either:
      - pattern: Random().nextInt(...)
      - pattern: Random().nextDouble()
      - pattern: Random().nextBool()

  # ── CBOM Inventory Rules ──

  - id: cbom-dart-crypto-library-import
    message: Cryptographic package import detected in Dart.
    severity: INFO
    languages: [dart]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-LIBRARY-IMPORT
      cbom-library: dart-crypto-or-pointycastle-or-dart-cryptography
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: import 'package:crypto/$X';
      - pattern: import 'package:pointycastle/$X';
      - pattern: import 'package:cryptography/$X';

  # ── GOST R 34.11 hash (PointyCastle) ──
  #
  # PointyCastle (Dart's BouncyCastle port) exposes GOST3411Digest and a
  # registry lookup Digest('GOST3411'). Tied to those specific identifiers
  # so unrelated code is never matched.

  - id: cbom-dart-gost3411
    message: "GOST R 34.11 hash (PointyCastle) detected"
    severity: INFO
    languages: [dart]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: GOST3411
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: GOST3411Digest()
      - pattern: Digest("GOST3411")
