rules:
  - id: cbom-js-hardcoded-key-createcipher
    message: >
      Hardcoded cryptographic key or password flows into cipher creation.
      Keys should be loaded from environment variables or key management systems.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive-from-metavar: $ALGO
      cbom-primitive-fallback: SYMMETRIC-CIPHER
      confidence: high
      quantum-relevant: false
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          $KEY = "..."
          ...
          crypto.createCipher($ALGO, $KEY)
      - pattern: crypto.createCipher($ALGO, "...")

  - id: cbom-js-hardcoded-iv-createcipheriv
    message: >
      Static initialization vector (IV) used in createCipheriv. IVs must
      be randomly generated using crypto.randomBytes().
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive-from-metavar: $ALGO
      cbom-primitive-fallback: SYMMETRIC-CIPHER
      confidence: high
      quantum-relevant: false
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          $IV = Buffer.from("...")
          ...
          crypto.createCipheriv($ALGO, $KEY, $IV)
      - pattern: |
          const $IV = "..."
          ...
          crypto.createCipheriv($ALGO, $KEY, $IV)

  - id: cbom-js-hardcoded-jwt-secret
    message: >
      Hardcoded secret used for JWT signing. JWT secrets should be
      stored in environment variables or secret management systems.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive: HMAC
      confidence: high
      quantum-relevant: false
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: jwt.sign($PAYLOAD, "...", ...)
      - pattern: |
          $SECRET = "..."
          ...
          jwt.sign($PAYLOAD, $SECRET, ...)

  - id: cbom-js-hardcoded-hmac-key
    message: >
      Hardcoded key used in HMAC creation. HMAC keys should be
      stored securely.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive: HMAC
      cbom-primitive-hash-from-metavar: $ALGO
      confidence: high
      quantum-relevant: false
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: crypto.createHmac($ALGO, "...")
      - pattern: |
          $KEY = "..."
          ...
          crypto.createHmac($ALGO, $KEY)

  - id: cbom-js-math-random-security
    message: >
      Math.random() is not cryptographically secure. Use
      crypto.randomBytes() or crypto.getRandomValues() instead.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: WEAK-PRNG
      confidence: low
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: Math.random()

  # ── CBOM Inventory Rules ──

  - id: cbom-js-crypto-library-import
    message: >
      Cryptographic library import/require detected.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-LIBRARY-IMPORT
      cbom-library: nodejs-crypto-or-forge-or-jwt-or-bcrypt-or-argon2
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: const $X = require('crypto')
      - pattern: const $X = require('node-forge')
      - pattern: const $X = require('jsonwebtoken')
      - pattern: const $X = require('bcrypt')
      - pattern: const $X = require('argon2')
      - pattern: import $X from 'crypto'

  # ── SSL 3.0 protocol detection (Phase A4) ──

  - id: cbom-js-sslv3-protocol
    message: "SSL 3.0 protocol detected (broken)"
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: inventory
      cbom-asset-type: protocol
      cbom-primitive: SSL-3.0
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: |
          { ..., secureProtocol: "SSLv3_method", ... }
      - pattern: |
          { ..., secureProtocol: 'SSLv3_method', ... }

  # ── Node crypto cipher-spec inventory (Phase A2) ──
  #
  # createCipheriv("aes-256-gcm", …) / createCipher("des-ecb", …) etc.
  # The canonicalizer uppercases and rewrites "aes-256-gcm" -> "AES-256-GCM",
  # "des-ecb" -> "DES-ECB", "rc4" -> "RC4". Without this rule the spec string
  # never reaches the parser.

  - id: cbom-js-cipher-spec-inventory
    message: "Node crypto cipher-spec detected"
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive-from-metavar: $ALGO
      cbom-primitive-fallback: SYMMETRIC-CIPHER
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: crypto.createCipheriv("$ALGO", ...)
      - pattern: crypto.createDecipheriv("$ALGO", ...)
      - pattern: crypto.createCipher("$ALGO", ...)
      - pattern: crypto.createDecipher("$ALGO", ...)
      - pattern: crypto.createCipheriv('$ALGO', ...)
      - pattern: crypto.createDecipheriv('$ALGO', ...)
      - pattern: crypto.createCipher('$ALGO', ...)
      - pattern: crypto.createDecipher('$ALGO', ...)

  - id: cbom-js-deprecated-crypto-import
    message: >
      crypto-js library imported. Often misused for server-side crypto;
      prefer Node.js built-in crypto module.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-LIBRARY-IMPORT
      cbom-library: crypto-js
      confidence: medium
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: const $X = require('crypto-js')
      - pattern: import $X from 'crypto-js'

  - id: cbom-js-kdf-to-cipher-chain-pbkdf2
    message: >
      Key derivation chain: PBKDF2 output used as cipher key.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: inventory
      cbom-asset-type: key-derivation-function
      cbom-primitive: PBKDF2
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: |
      $KEY = crypto.pbkdf2Sync($PASSWORD, $SALT, $ITER, $LEN, $HASH)
      ...
      crypto.createCipheriv($ALGO, $KEY, $IV)

  - id: cbom-js-kdf-to-cipher-chain-scrypt
    message: >
      Key derivation chain: scrypt output used as cipher key.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: inventory
      cbom-asset-type: key-derivation-function
      cbom-primitive: SCRYPT
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: |
      $KEY = crypto.scryptSync($PASSWORD, $SALT, $LEN)
      ...
      crypto.createCipheriv($ALGO, $KEY, $IV)

  - id: cbom-js-config-driven-algorithm
    message: >
      Algorithm name from environment used in crypto operation. When the
      algorithm string is a static literal the rule resolves to its
      canonical primitive; when it is a runtime value no primitive token
      is emitted (the finding still records the createCipheriv call site
      for inventory).
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive-from-metavar: $ALGO
      # Intentionally no cbom-primitive-fallback: see python rule for
      # rationale. TestNoCoarseMarkers enforces this.
      confidence: medium
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: |
          $ALGO = process.env.$KEY
          ...
          crypto.createCipheriv($ALGO, ...)
      - pattern: |
          $ALGO = process.env.$KEY
          ...
          crypto.createHash($ALGO)

  # ── Phase B1: EC named curves (node:crypto + WebCrypto) ──

  - id: cbom-js-named-curve-p-256
    message: "EC named curve P-256 detected"
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: P-256
      confidence: high
      quantum-relevant: true
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: |
          { ..., namedCurve: "P-256", ... }
      - pattern: |
          { ..., namedCurve: 'P-256', ... }

  - id: cbom-js-named-curve-p-384
    message: "EC named curve P-384 detected"
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: P-384
      confidence: high
      quantum-relevant: true
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: |
          { ..., namedCurve: "P-384", ... }
      - pattern: |
          { ..., namedCurve: 'P-384', ... }

  - id: cbom-js-named-curve-p-521
    message: "EC named curve P-521 detected"
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: P-521
      confidence: high
      quantum-relevant: true
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: |
          { ..., namedCurve: "P-521", ... }
      - pattern: |
          { ..., namedCurve: 'P-521', ... }

  # ── CSPRNG: cryptographically secure random byte generation ──
  #
  # crypto.randomBytes / crypto.randomFillSync / crypto.randomFill are the
  # Node.js CSPRNG entry points; crypto.getRandomValues is the Web Crypto
  # equivalent. All draw from the OS CSPRNG, so a literal call is an
  # unambiguous CSPRNG asset (no FP risk — these names are crypto-specific).
  - id: cbom-js-csprng
    message: "Cryptographically secure RNG (CSPRNG) usage detected"
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: CSPRNG
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: crypto.randomBytes(...)
      - pattern: crypto.randomFillSync(...)
      - pattern: crypto.randomFill(...)
      - pattern: crypto.getRandomValues(...)

  # ── Phase D6: Web Crypto API library import (browser/Deno/Node 15+) ──
  #
  # crypto.subtle is the entry point for the W3C Web Crypto API. Distinct
  # from node:crypto / require('crypto'); rules to attribute usage to the
  # WEBCRYPTO library bucket in the v2 GT.

  - id: cbom-js-webcrypto-library-import
    message: "Web Crypto API (crypto.subtle) usage detected"
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-LIBRARY-IMPORT
      cbom-library: webcrypto
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: crypto.subtle
      - pattern: window.crypto.subtle
      - pattern: self.crypto.subtle
      - pattern: globalThis.crypto.subtle
