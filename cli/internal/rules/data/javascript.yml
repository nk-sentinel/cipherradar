rules:
  - id: cbom-js-hardcoded-key-createcipher
    message: >
      Hardcoded cryptographic key or password flows into cipher creation.
      Keys should be loaded from environment variables or key management systems.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      confidence: high
      quantum-relevant: false
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          $KEY = "..."
          ...
          crypto.createCipher($ALGO, $KEY)
      - pattern: crypto.createCipher($ALGO, "...")

  - id: cbom-js-hardcoded-iv-createcipheriv
    message: >
      Static initialization vector (IV) used in createCipheriv. IVs must
      be randomly generated using crypto.randomBytes().
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      confidence: high
      quantum-relevant: false
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          $IV = Buffer.from("...")
          ...
          crypto.createCipheriv($ALGO, $KEY, $IV)
      - pattern: |
          const $IV = "..."
          ...
          crypto.createCipheriv($ALGO, $KEY, $IV)

  - id: cbom-js-hardcoded-jwt-secret
    message: >
      Hardcoded secret used for JWT signing. JWT secrets should be
      stored in environment variables or secret management systems.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      confidence: high
      quantum-relevant: false
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: jwt.sign($PAYLOAD, "...", ...)
      - pattern: |
          $SECRET = "..."
          ...
          jwt.sign($PAYLOAD, $SECRET, ...)

  - id: cbom-js-hardcoded-hmac-key
    message: >
      Hardcoded key used in HMAC creation. HMAC keys should be
      stored securely.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      confidence: high
      quantum-relevant: false
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: crypto.createHmac($ALGO, "...")
      - pattern: |
          $KEY = "..."
          ...
          crypto.createHmac($ALGO, $KEY)

  - id: cbom-js-math-random-security
    message: >
      Math.random() is not cryptographically secure. Use
      crypto.randomBytes() or crypto.getRandomValues() instead.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: security
      cbom-asset-type: algorithm
      confidence: low
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: Math.random()

  # ── CBOM Inventory Rules ──

  - id: cbom-js-crypto-library-import
    message: >
      Cryptographic library import/require detected.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: inventory
      cbom-asset-type: library
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: const $X = require('crypto')
      - pattern: const $X = require('node-forge')
      - pattern: const $X = require('jsonwebtoken')
      - pattern: const $X = require('bcrypt')
      - pattern: const $X = require('argon2')
      - pattern: import $X from 'crypto'

  - id: cbom-js-deprecated-crypto-import
    message: >
      crypto-js library imported. Often misused for server-side crypto;
      prefer Node.js built-in crypto module.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: inventory
      cbom-asset-type: library
      confidence: medium
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: const $X = require('crypto-js')
      - pattern: import $X from 'crypto-js'

  - id: cbom-js-kdf-to-cipher-chain
    message: >
      Key derivation chain: PBKDF2/scrypt output used as cipher key.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: inventory
      cbom-asset-type: key-derivation-function
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: |
          $KEY = crypto.pbkdf2Sync($PASSWORD, $SALT, $ITER, $LEN, $HASH)
          ...
          crypto.createCipheriv($ALGO, $KEY, $IV)
      - pattern: |
          $KEY = crypto.scryptSync($PASSWORD, $SALT, $LEN)
          ...
          crypto.createCipheriv($ALGO, $KEY, $IV)

  - id: cbom-js-config-driven-algorithm
    message: >
      Algorithm name from environment used in crypto operation.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      confidence: medium
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: |
          $ALGO = process.env.$KEY
          ...
          crypto.createCipheriv($ALGO, ...)
      - pattern: |
          $ALGO = process.env.$KEY
          ...
          crypto.createHash($ALGO)
