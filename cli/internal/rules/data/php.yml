rules:
  - id: cbom-php-hardcoded-key-openssl
    message: >
      Hardcoded cryptographic key flows into openssl_encrypt(). Keys
      should be loaded from environment variables or secret management
      systems, never embedded in source code.
    severity: ERROR
    languages: [php]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive-from-metavar: $METHOD
      cbom-primitive-fallback: SYMMETRIC-KEY
      confidence: high
      quantum-relevant: true
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          $KEY = "...";
          ...
          openssl_encrypt($DATA, $METHOD, $KEY, ...);
      - pattern: openssl_encrypt($DATA, $METHOD, "...", ...)

  - id: cbom-php-weak-hash-md5
    message: >
      md5() produces a 128-bit hash that is cryptographically broken.
      Use hash('sha256', ...) or password_hash() for security-sensitive
      hashing operations.
    severity: WARNING
    languages: [php]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: MD5
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: md5(...)

  - id: cbom-php-mcrypt-deprecated
    message: >
      mcrypt extension is deprecated since PHP 7.1 and removed in PHP 7.2.
      Migrate to openssl_encrypt()/openssl_decrypt() with authenticated
      encryption modes (e.g., AES-256-GCM).
    severity: ERROR
    languages: [php]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: DEPRECATED-CRYPTO
      cbom-library: mcrypt
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: mcrypt_encrypt(...)
      - pattern: mcrypt_decrypt(...)
      - pattern: mcrypt_create_iv(...)
      - pattern: mcrypt_get_iv_size(...)
      - pattern: mcrypt_module_open(...)

  # ── CBOM Inventory Rules ──

  - id: cbom-php-deprecated-crypto
    message: Deprecated mcrypt library used. Removed since PHP 7.2.
    severity: WARNING
    languages: [php]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-LIBRARY-IMPORT
      cbom-library: mcrypt
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: mcrypt_encrypt(...)
      - pattern: mcrypt_decrypt(...)

  # ── PHP password_hash() per-algorithm inventory (Phase C1) ──
  #
  # Replaces the prior coarse `cbom-php-password-hash-inventory` rule whose
  # metavar capture of `$ALGO` rarely resolved (PASSWORD_BCRYPT and friends
  # are bare constants, not strings, so the canonicalizer dropped them).
  # The split lets each constant emit its specific BCRYPT / ARGON2I /
  # ARGON2ID primitive token.

  - id: cbom-php-password-hash-bcrypt
    message: "bcrypt password hash via password_hash() detected"
    severity: INFO
    languages: [php]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: BCRYPT
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: password_hash($PASSWORD, PASSWORD_BCRYPT)
      - pattern: password_hash($PASSWORD, PASSWORD_BCRYPT, $OPTIONS)
      - pattern: password_hash($PASSWORD, PASSWORD_DEFAULT)
      - pattern: password_hash($PASSWORD, PASSWORD_DEFAULT, $OPTIONS)

  - id: cbom-php-password-hash-argon2id
    message: "Argon2id password hash via password_hash() detected"
    severity: INFO
    languages: [php]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: ARGON2ID
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: password_hash($PASSWORD, PASSWORD_ARGON2ID)
      - pattern: password_hash($PASSWORD, PASSWORD_ARGON2ID, $OPTIONS)

  - id: cbom-php-password-hash-argon2i
    message: "Argon2i password hash via password_hash() detected"
    severity: INFO
    languages: [php]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: ARGON2I
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: password_hash($PASSWORD, PASSWORD_ARGON2I)
      - pattern: password_hash($PASSWORD, PASSWORD_ARGON2I, $OPTIONS)
