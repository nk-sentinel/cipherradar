rules:
  - id: cbom-php-hardcoded-key-openssl
    message: >
      Hardcoded cryptographic key flows into openssl_encrypt(). Keys
      should be loaded from environment variables or secret management
      systems, never embedded in source code.
    severity: ERROR
    languages: [php]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive-from-metavar: $METHOD
      cbom-primitive-fallback: SYMMETRIC-KEY
      confidence: high
      quantum-relevant: true
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          $KEY = "...";
          ...
          openssl_encrypt($DATA, $METHOD, $KEY, ...);
      - pattern: openssl_encrypt($DATA, $METHOD, "...", ...)

  - id: cbom-php-weak-hash-md5
    message: >
      md5() produces a 128-bit hash that is cryptographically broken.
      Use hash('sha256', ...) or password_hash() for security-sensitive
      hashing operations.
    severity: WARNING
    languages: [php]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: MD5
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: md5(...)

  # ── PHP mcrypt per-algorithm security findings (Phase C2) ──
  #
  # Splits the prior cbom-php-mcrypt-deprecated rule (which emitted the
  # opaque DEPRECATED-CRYPTO marker) into per-cipher rules so each finding
  # carries its specific canonical primitive (DES / 3DES / BLOWFISH /
  # RC4 / etc).  The library-context messaging (mcrypt is removed in
  # PHP 7.2) is preserved in each per-cipher message.

  - id: cbom-php-mcrypt-des
    message: >
      DES via deprecated mcrypt API. mcrypt was removed in PHP 7.2; DES
      is also cryptographically broken. Migrate to openssl_encrypt() with
      an authenticated mode (e.g. AES-256-GCM).
    severity: ERROR
    languages: [php]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: DES
      cbom-library: mcrypt
      confidence: high
      quantum-relevant: false
      maturity: deprecated
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: mcrypt_encrypt(MCRYPT_DES, ...)
      - pattern: mcrypt_decrypt(MCRYPT_DES, ...)

  - id: cbom-php-mcrypt-3des
    message: >
      3DES (TripleDES) via deprecated mcrypt API. mcrypt was removed in
      PHP 7.2; 3DES is no longer NIST-approved. Migrate to AES-256-GCM
      via openssl_encrypt().
    severity: ERROR
    languages: [php]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: 3DES
      cbom-library: mcrypt
      confidence: high
      quantum-relevant: false
      maturity: deprecated
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: mcrypt_encrypt(MCRYPT_3DES, ...)
      - pattern: mcrypt_decrypt(MCRYPT_3DES, ...)
      - pattern: mcrypt_encrypt(MCRYPT_TRIPLEDES, ...)
      - pattern: mcrypt_decrypt(MCRYPT_TRIPLEDES, ...)

  - id: cbom-php-mcrypt-blowfish
    message: >
      Blowfish via deprecated mcrypt API. mcrypt was removed in PHP 7.2.
      Migrate to AES-256-GCM via openssl_encrypt().
    severity: ERROR
    languages: [php]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: BLOWFISH
      cbom-library: mcrypt
      confidence: high
      quantum-relevant: false
      maturity: deprecated
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: mcrypt_encrypt(MCRYPT_BLOWFISH, ...)
      - pattern: mcrypt_decrypt(MCRYPT_BLOWFISH, ...)

  - id: cbom-php-mcrypt-rc4
    message: >
      RC4 via deprecated mcrypt API. mcrypt was removed in PHP 7.2; RC4
      is cryptographically broken. Migrate to AES-256-GCM or
      ChaCha20-Poly1305 via openssl_encrypt().
    severity: ERROR
    languages: [php]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: RC4
      cbom-library: mcrypt
      confidence: high
      quantum-relevant: false
      maturity: deprecated
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: mcrypt_encrypt(MCRYPT_ARCFOUR, ...)
      - pattern: mcrypt_decrypt(MCRYPT_ARCFOUR, ...)
      - pattern: mcrypt_encrypt(MCRYPT_RC4, ...)
      - pattern: mcrypt_decrypt(MCRYPT_RC4, ...)

  # mcrypt setup APIs (create_iv / get_iv_size / module_open) don't carry
  # the cipher in the argument and signal library use rather than a
  # specific algorithm; report them via the inventory rule below so they
  # show up as a CRYPTO-LIBRARY-IMPORT finding (not a coarse-cipher
  # finding). This keeps the security severity tied to the actual
  # encrypt/decrypt call.

  # ── CBOM Inventory Rules ──

  - id: cbom-php-deprecated-crypto
    message: Deprecated mcrypt library used. Removed since PHP 7.2.
    severity: WARNING
    languages: [php]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-LIBRARY-IMPORT
      cbom-library: mcrypt
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: mcrypt_encrypt(...)
      - pattern: mcrypt_decrypt(...)
      - pattern: mcrypt_create_iv(...)
      - pattern: mcrypt_get_iv_size(...)
      - pattern: mcrypt_module_open(...)

  - id: cbom-php-crypto-library-import
    message: Cryptographic library usage detected in PHP source.
    severity: INFO
    languages: [php]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-LIBRARY-IMPORT
      cbom-library: firebase-php-jwt-or-defuse-php-encryption
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: use Firebase\JWT\JWT;
      - pattern: use Firebase\JWT\Key;
      - pattern: use Defuse\Crypto\Crypto;
      - pattern: use Defuse\Crypto\Key;

  # ── PHP password_hash() per-algorithm inventory (Phase C1) ──
  #
  # Replaces the prior coarse `cbom-php-password-hash-inventory` rule whose
  # metavar capture of `$ALGO` rarely resolved (PASSWORD_BCRYPT and friends
  # are bare constants, not strings, so the canonicalizer dropped them).
  # The split lets each constant emit its specific BCRYPT / ARGON2I /
  # ARGON2ID primitive token.

  - id: cbom-php-password-hash-bcrypt
    message: "bcrypt password hash via password_hash() detected"
    severity: INFO
    languages: [php]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: BCRYPT
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: password_hash($PASSWORD, PASSWORD_BCRYPT)
      - pattern: password_hash($PASSWORD, PASSWORD_BCRYPT, $OPTIONS)
      - pattern: password_hash($PASSWORD, PASSWORD_DEFAULT)
      - pattern: password_hash($PASSWORD, PASSWORD_DEFAULT, $OPTIONS)

  - id: cbom-php-password-hash-argon2id
    message: "Argon2id password hash via password_hash() detected"
    severity: INFO
    languages: [php]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: ARGON2ID
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: password_hash($PASSWORD, PASSWORD_ARGON2ID)
      - pattern: password_hash($PASSWORD, PASSWORD_ARGON2ID, $OPTIONS)

  - id: cbom-php-password-hash-argon2i
    message: "Argon2i password hash via password_hash() detected"
    severity: INFO
    languages: [php]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: ARGON2I
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: password_hash($PASSWORD, PASSWORD_ARGON2I)
      - pattern: password_hash($PASSWORD, PASSWORD_ARGON2I, $OPTIONS)

  # ── GOST R 34.11 hash via PHP hash() extension ──
  #
  # PHP's hash() exposes the GOST family ('gost', 'gost-crypto') and the
  # Streebog variants ('streebog256', 'streebog512'). Tied to literal
  # algorithm strings so no false positives on other hash() calls.

  - id: cbom-php-hash-gost
    message: "GOST R 34.11 hash detected"
    severity: INFO
    languages: [php]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: GOST3411
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: hash("gost", ...)
      - pattern: hash("gost-crypto", ...)
      - pattern: hash("streebog256", ...)
      - pattern: hash("streebog512", ...)
      - pattern: hash_init("gost")
      - pattern: hash_init("gost-crypto")
