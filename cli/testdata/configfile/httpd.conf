# Apache httpd configuration with SSL settings.

ServerRoot "/etc/httpd"
Listen 443

LoadModule ssl_module modules/mod_ssl.so

<VirtualHost *:443>
    ServerName example.com

    SSLEngine on

    # Weak protocol configuration — should be detected.
    SSLProtocol all -SSLv2 +SSLv3 +TLSv1

    # Weak cipher suite — should be detected.
    SSLCipherSuite RC4-SHA:DES-CBC3-SHA:AES128-SHA:HIGH

    SSLCertificateFile /etc/httpd/ssl/server.crt
    SSLCertificateKeyFile /etc/httpd/ssl/server.key
</VirtualHost>

# Secure virtual host.
<VirtualHost *:443>
    ServerName secure.example.com

    SSLEngine on

    # Good protocol config.
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1

    # Strong cipher suite.
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384

    SSLCertificateFile /etc/httpd/ssl/secure.crt
    SSLCertificateKeyFile /etc/httpd/ssl/secure.key
</VirtualHost>
