server {
    listen 443 ssl;
    server_name example.com;

    # Weak TLS protocols — should be detected.
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    # Weak ciphers — should be detected.
    ssl_ciphers RC4-SHA:DES-CBC3-SHA:AES128-SHA:HIGH:!aNULL:!MD5;

    # Certificate paths — should be detected as certificate assets.
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    location / {
        proxy_pass http://backend;
    }
}

# Another server block with good config.
server {
    listen 443 ssl;
    server_name secure.example.com;

    # Good TLS config — TLSv1.2 and 1.3 only.
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    ssl_certificate /etc/nginx/ssl/secure.crt;
    ssl_certificate_key /etc/nginx/ssl/secure.key;
}
