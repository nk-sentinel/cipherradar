version: 2

project_name: cradar

before:
  hooks:
    # Sync OpenGrep rules before build
    - go generate ./internal/rules

builds:
  # Lightweight binary — cradar only, no tools bundled
  - id: cradar
    main: ./cmd/cradar
    binary: cradar
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows arm64 is rare — skip for now
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/nk-sentinel/cipherradar/cli/internal/cmd.Version={{.Version}}
      - -X github.com/nk-sentinel/cipherradar/cli/internal/cmd.Commit={{.Commit}}
      - -X github.com/nk-sentinel/cipherradar/cli/internal/cmd.BuildDate={{.Date}}

  # Full binary — same binary, bundled with OpenGrep in the archive
  - id: cradar-full
    main: ./cmd/cradar
    binary: cradar
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/nk-sentinel/cipherradar/cli/internal/cmd.Version={{.Version}}
      - -X github.com/nk-sentinel/cipherradar/cli/internal/cmd.Commit={{.Commit}}
      - -X github.com/nk-sentinel/cipherradar/cli/internal/cmd.BuildDate={{.Date}}

archives:
  # Lightweight archive — just the cradar binary
  - id: cradar-archive
    builds:
      - cradar
    name_template: "cradar_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

  # Full archive — cradar binary + OpenGrep + YARA-X binaries
  # NOTE: Tool binaries must be placed in dist/<tool>-<os>-<arch>/
  # before running goreleaser, via CI pre-build steps.
  # Joern removed per ADR-033 — all patterns covered by OpenGrep rules.
  - id: cradar-full-archive
    builds:
      - cradar-full
    name_template: "cradar-full_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - src: "dist/opengrep-{{ .Os }}-{{ .Arch }}/*"
        dst: .
        strip_parent: true
      - src: "dist/yara-x-{{ .Os }}-{{ .Arch }}/*"
        dst: .
        strip_parent: true
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

release:
  github:
    owner: nk-sentinel
    name: cipherradar
  name_template: "v{{.Version}}"
  draft: false
