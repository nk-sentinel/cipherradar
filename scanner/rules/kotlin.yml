rules:
  - id: cbom-kotlin-hardcoded-key-secretkeyspec
    message: >
      Hardcoded cryptographic key detected flowing into SecretKeySpec.
      Hardcoded keys are extractable from compiled bytecode and should
      be loaded from secure key stores or environment variables.
    severity: ERROR
    languages: [kotlin]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive: SYMMETRIC-KEY
      confidence: high
      quantum-relevant: false
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          val $KEY = byteArrayOf(...)
          ...
          SecretKeySpec($KEY, ...)
      - pattern: |
          val $KEY = "..."
          ...
          SecretKeySpec($KEY.toByteArray(...), ...)

  - id: cbom-kotlin-hardcoded-iv
    message: >
      Static initialization vector (IV) detected. IVs must be randomly
      generated for each encryption operation to prevent pattern leakage.
    severity: WARNING
    languages: [kotlin]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive: INITIALIZATION-VECTOR
      confidence: high
      quantum-relevant: false
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          val $IV = byteArrayOf(...)
          ...
          IvParameterSpec($IV)
      - pattern: |
          IvParameterSpec("...".toByteArray(...))

  - id: cbom-kotlin-ecb-mode
    message: >
      ECB mode used for block cipher. ECB does not provide semantic
      security — identical plaintext blocks produce identical ciphertext.
      Use CBC, GCM, or another authenticated mode instead.
    severity: WARNING
    languages: [kotlin]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: AES-ECB
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: Cipher.getInstance("=~/.*ECB.*/")

  # ── CBOM Inventory Rules ──

  - id: cbom-kotlin-crypto-library-import
    message: Cryptographic library import detected in Kotlin source.
    severity: INFO
    languages: [kotlin]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-LIBRARY-IMPORT
      cbom-library: bouncycastle-or-jca
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: import org.bouncycastle.$X
      - pattern: import javax.crypto.$X
      - pattern: import java.security.$X
      - pattern: import javax.net.ssl.$X
      - pattern: import org.bouncycastle.$X.$Y
      - pattern: import javax.crypto.$X.$Y
      - pattern: import java.security.$X.$Y
      - pattern: import javax.net.ssl.$X.$Y

  # ── Phase D3: Version-specific TLS protocol attribution ──

  - id: cbom-kotlin-tlsv1_0
    message: "TLS 1.0 protocol detected (broken)"
    severity: WARNING
    languages: [kotlin]
    metadata:
      category: inventory
      cbom-asset-type: protocol
      cbom-primitive: TLS-1.0
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: SSLContext.getInstance("TLSv1")
      - pattern: SSLContext.getInstance("TLS-1.0")

  - id: cbom-kotlin-tlsv1_1
    message: "TLS 1.1 protocol detected (deprecated)"
    severity: WARNING
    languages: [kotlin]
    metadata:
      category: inventory
      cbom-asset-type: protocol
      cbom-primitive: TLS-1.1
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: SSLContext.getInstance("TLSv1.1")
      - pattern: SSLContext.getInstance("TLS-1.1")
