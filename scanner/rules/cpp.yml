rules:
  - id: cbom-cpp-hardcoded-key-aes
    message: >
      Hardcoded cryptographic key detected flowing into AES_set_encrypt_key().
      Hardcoded keys are extractable from compiled binaries and should be
      loaded from secure key stores or environment variables.
    severity: ERROR
    languages: [cpp, c]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive: AES
      confidence: high
      quantum-relevant: true
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          unsigned char $KEY[] = { ... };
          ...
          AES_set_encrypt_key($KEY, ...);
      - pattern: |
          const unsigned char $KEY[] = { ... };
          ...
          AES_set_encrypt_key($KEY, ...);
      - pattern: |
          unsigned char $KEY[] = "...";
          ...
          AES_set_encrypt_key($KEY, ...);
      - pattern: |
          uint8_t $KEY[] = { ... };
          ...
          AES_set_encrypt_key($KEY, ...);

  - id: cbom-cpp-weak-rand
    message: >
      rand() or srand() used for generating values. The C standard library
      PRNG is not cryptographically secure. Use platform-specific CSPRNGs
      such as RAND_bytes() from OpenSSL, getrandom(), or arc4random_buf().
    severity: WARNING
    languages: [cpp, c]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: WEAK-PRNG
      confidence: medium
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: rand()
      - pattern: srand(...)
      - pattern: |
          $VAL = rand();
      - pattern: |
          $VAL = rand() % ...;

  # ── OpenSSL deprecated-API per-algorithm security findings (Phase C2) ──
  #
  # Splits the prior cbom-cpp-deprecated-api rule (which emitted the
  # opaque DEPRECATED-CRYPTO marker) into per-cipher/per-hash rules so
  # each finding carries its specific canonical primitive (DES / RC4 /
  # MD5). Migration guidance is preserved per-rule.

  - id: cbom-cpp-openssl-des
    message: >
      DES via OpenSSL low-level API. DES is cryptographically broken;
      migrate to AES-256-GCM or ChaCha20-Poly1305.
    severity: ERROR
    languages: [cpp, c]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: DES
      confidence: high
      quantum-relevant: false
      maturity: deprecated
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: DES_set_key(...)
      - pattern: DES_set_key_checked(...)
      - pattern: DES_set_key_unchecked(...)
      - pattern: DES_ecb_encrypt(...)
      - pattern: DES_ncbc_encrypt(...)
      - pattern: DES_cbc_encrypt(...)

  - id: cbom-cpp-openssl-rc4
    message: >
      RC4 via OpenSSL low-level API. RC4 is cryptographically broken;
      migrate to AES-256-GCM or ChaCha20-Poly1305.
    severity: ERROR
    languages: [cpp, c]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: RC4
      confidence: high
      quantum-relevant: false
      maturity: deprecated
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: RC4_set_key(...)
      - pattern: RC4(...)

  - id: cbom-cpp-openssl-md5
    message: >
      MD5 via OpenSSL low-level API. MD5 is cryptographically broken for
      security uses; migrate to SHA-256 or SHA-3.
    severity: ERROR
    languages: [cpp, c]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: MD5
      confidence: high
      quantum-relevant: false
      maturity: deprecated
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: MD5_Init(...)
      - pattern: MD5_Update(...)
      - pattern: MD5_Final(...)
      - pattern: MD5(...)

  # ── CBOM Inventory Rules ──

  - id: cbom-cpp-crypto-library-import
    message: Cryptographic library include detected in C/C++.
    severity: INFO
    languages: [cpp]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-LIBRARY-IMPORT
      cbom-library: openssl-or-libsodium
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: |
          #include <openssl/$X>
      - pattern: |
          #include <sodium.h>
