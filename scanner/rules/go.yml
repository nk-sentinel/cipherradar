rules:
  - id: cbom-go-hardcoded-key-aes
    message: >
      Hardcoded byte slice key flows into aes.NewCipher(). Hardcoded keys
      are extractable from compiled binaries and should be loaded from
      environment variables or secret management systems.
    severity: ERROR
    languages: [go]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      confidence: high
      quantum-relevant: true
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          $KEY := []byte{...}
          ...
          aes.NewCipher($KEY)
      - pattern: |
          $KEY := []byte("...")
          ...
          aes.NewCipher($KEY)

  - id: cbom-go-hardcoded-key-hmac
    message: >
      Hardcoded key flows into hmac.New(). HMAC keys should be stored
      securely and rotated regularly, not embedded in source code.
    severity: ERROR
    languages: [go]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      confidence: high
      quantum-relevant: false
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          $KEY := []byte{...}
          ...
          hmac.New($HASH, $KEY)
      - pattern: |
          $KEY := []byte("...")
          ...
          hmac.New($HASH, $KEY)

  - id: cbom-go-weak-rand
    message: >
      math/rand is not cryptographically secure. Use crypto/rand for
      generating keys, nonces, IVs, or any security-sensitive random values.
    severity: WARNING
    languages: [go]
    metadata:
      category: security
      cbom-asset-type: algorithm
      confidence: medium
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: rand.Read(...)
        fix: Use crypto/rand.Read() instead of math/rand.
      - pattern: rand.Int(...)
      - pattern: rand.Intn(...)

  # ── CBOM Inventory Rules ──

  - id: cbom-go-crypto-library-import
    message: >
      Cryptographic library import detected in Go source.
    severity: INFO
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: library
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: import "crypto/$..."
      - pattern: import "golang.org/x/crypto/$..."

  - id: cbom-go-kdf-to-cipher-chain
    message: >
      Key derivation output used as cipher key in Go.
    severity: INFO
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: key-derivation-function
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: |
          $KEY, $ERR = scrypt.Key($PASSWORD, $SALT, $N, $R, $P, $LEN)
          ...
          $BLOCK, $ERR2 = aes.NewCipher($KEY)
      - pattern: |
          $KEY = argon2.IDKey($PASSWORD, $SALT, $TIME, $MEM, $THREADS, $LEN)
          ...
          $BLOCK, $ERR = aes.NewCipher($KEY)

  - id: cbom-go-tls-version-enforcement
    message: >
      TLS version enforcement detected in Go tls.Config.
    severity: INFO
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: protocol
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: |
      &tls.Config{
        ...,
        MinVersion: $MIN,
        ...,
      }

  - id: cbom-go-password-hash-inventory
    message: >
      Password hashing function detected in Go.
    severity: INFO
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: bcrypt.GenerateFromPassword($PASSWORD, $COST)
      - pattern: argon2.IDKey($PASSWORD, $SALT, $TIME, $MEM, $THREADS, $LEN)
