rules:
  - id: cbom-go-hardcoded-key-aes
    message: >
      Hardcoded byte slice key flows into aes.NewCipher(). Hardcoded keys
      are extractable from compiled binaries and should be loaded from
      environment variables or secret management systems.
    severity: ERROR
    languages: [go]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive: AES
      confidence: high
      quantum-relevant: true
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          $KEY := []byte{...}
          ...
          aes.NewCipher($KEY)
      - pattern: |
          $KEY := []byte("...")
          ...
          aes.NewCipher($KEY)

  - id: cbom-go-hardcoded-key-hmac
    message: >
      Hardcoded key flows into hmac.New(). HMAC keys should be stored
      securely and rotated regularly, not embedded in source code.
    severity: ERROR
    languages: [go]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive: HMAC
      confidence: high
      quantum-relevant: false
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          $KEY := []byte{...}
          ...
          hmac.New($HASH, $KEY)
      - pattern: |
          $KEY := []byte("...")
          ...
          hmac.New($HASH, $KEY)

  - id: cbom-go-weak-rand
    message: >
      math/rand is not cryptographically secure. Use crypto/rand for
      generating keys, nonces, IVs, or any security-sensitive random values.
    severity: WARNING
    languages: [go]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: WEAK-PRNG
      confidence: medium
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: rand.Read(...)
      - pattern: rand.Int(...)
      - pattern: rand.Intn(...)

  # ── CBOM Inventory Rules ──

  - id: cbom-go-crypto-library-import
    message: >
      Cryptographic library import detected in Go source.
    severity: INFO
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-LIBRARY-IMPORT
      cbom-library: go-crypto
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    # Go's parser treats `import "crypto/$..."` as a syntax error and silently
    # drops the rule, so the previous form never fired. Match any import
    # string and gate on the crypto packages via metavariable-regex — this
    # works for both single-line `import "crypto/aes"` and grouped
    # `import (...)` forms, because opengrep matches each quoted path inside
    # the parenthesised list.
    patterns:
      - pattern: import "$PKG"
      - metavariable-regex:
          metavariable: $PKG
          regex: '^(crypto|crypto/[A-Za-z0-9_/]+|golang\.org/x/crypto(/[A-Za-z0-9_/]+)?)$'

  # ── Go legacy symmetric ciphers (Phase A2) ──

  - id: cbom-go-des-cipher
    message: "DES cipher detected (broken)"
    severity: WARNING
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: DES
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: des.NewCipher(...)

  - id: cbom-go-3des-cipher
    message: "3DES (TripleDES) cipher detected"
    severity: WARNING
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: 3DES
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: des.NewTripleDESCipher(...)

  - id: cbom-go-rc4-cipher
    message: "RC4 cipher detected (broken)"
    severity: WARNING
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: RC4
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: rc4.NewCipher(...)

  - id: cbom-go-kdf-to-cipher-chain-scrypt
    message: >
      scrypt key derivation output used as AES cipher key in Go.
    severity: INFO
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: SCRYPT
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: |
      $KEY, $ERR = scrypt.Key($PASSWORD, $SALT, $N, $R, $P, $LEN)
      ...
      $BLOCK, $ERR2 = aes.NewCipher($KEY)

  - id: cbom-go-kdf-to-cipher-chain-argon2
    message: >
      Argon2id key derivation output used as AES cipher key in Go.
    severity: INFO
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: ARGON2ID
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: |
      $KEY = argon2.IDKey($PASSWORD, $SALT, $TIME, $MEM, $THREADS, $LEN)
      ...
      $BLOCK, $ERR = aes.NewCipher($KEY)

  - id: cbom-go-tls-version-enforcement
    message: >
      TLS version enforcement detected in Go tls.Config.
    severity: INFO
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: protocol
      cbom-primitive: TLS
      cbom-primitive-from-metavar: $MIN
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: |
      &tls.Config{
        ...,
        MinVersion: $MIN,
        ...,
      }

  - id: cbom-go-password-hash-bcrypt
    message: >
      bcrypt password hashing function detected in Go.
    severity: INFO
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: BCRYPT
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: bcrypt.GenerateFromPassword($PASSWORD, $COST)

  - id: cbom-go-password-hash-argon2
    message: >
      Argon2id password hashing function detected in Go.
    severity: INFO
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: ARGON2ID
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: argon2.IDKey($PASSWORD, $SALT, $TIME, $MEM, $THREADS, $LEN)

  # ── Phase B1: EC named curves (Go stdlib + x/crypto) ──

  - id: cbom-go-elliptic-p-256
    message: "EC curve P-256 detected"
    severity: INFO
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: P-256
      confidence: high
      quantum-relevant: true
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: elliptic.P256()

  - id: cbom-go-elliptic-p-384
    message: "EC curve P-384 detected"
    severity: INFO
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: P-384
      confidence: high
      quantum-relevant: true
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: elliptic.P384()

  - id: cbom-go-elliptic-p-521
    message: "EC curve P-521 detected"
    severity: INFO
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: P-521
      confidence: high
      quantum-relevant: true
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: elliptic.P521()

  - id: cbom-go-curve25519
    message: "Curve25519 / X25519 detected (golang.org/x/crypto/curve25519 or nacl/box)"
    severity: INFO
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: CURVE25519
      confidence: high
      quantum-relevant: true
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: curve25519.$X(...)
      - pattern: box.GenerateKey(...)

  # ── Phase D3: Version-specific TLS + SSH protocol attribution ──

  - id: cbom-go-tlsv1_0
    message: "TLS 1.0 protocol detected (broken)"
    severity: WARNING
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: protocol
      cbom-primitive: TLS-1.0
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: tls.VersionTLS10

  - id: cbom-go-tlsv1_1
    message: "TLS 1.1 protocol detected (deprecated)"
    severity: WARNING
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: protocol
      cbom-primitive: TLS-1.1
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: tls.VersionTLS11

  - id: cbom-go-ssh-protocol
    message: "SSH protocol usage detected (golang.org/x/crypto/ssh)"
    severity: INFO
    languages: [go]
    metadata:
      category: inventory
      cbom-asset-type: protocol
      cbom-primitive: SSH
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: ssh.Dial(...)
      - pattern: ssh.NewClientConn(...)
      - pattern: ssh.NewServerConn(...)
      - pattern: ssh.ParseRawPrivateKey(...)
      - pattern: ssh.ParsePrivateKey(...)
      - pattern: ssh.NewSignerFromKey(...)
      - pattern: ssh.NewPublicKey(...)
      - pattern: ssh.MarshalAuthorizedKey(...)
