rules:
  - id: cbom-swift-hardcoded-key
    message: >
      Hardcoded string literal flows into SymmetricKey construction.
      Hardcoded keys are extractable from application binaries and should
      be loaded from the Keychain or a secure key management system.
    severity: ERROR
    languages: [swift]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive: SYMMETRIC-KEY
      confidence: high
      quantum-relevant: true
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          let $KEY = "..."
          ...
          SymmetricKey(data: $KEY.data(using: ...))
      - pattern: |
          let $KEY = "...".data(using: ...)!
          ...
          SymmetricKey(data: $KEY)
      - pattern: |
          let $KEY: [UInt8] = [...]
          ...
          SymmetricKey(data: Data($KEY))
      - pattern: |
          SymmetricKey(data: "...".data(using: ...)!)

  - id: cbom-swift-insecure-hash-md5
    message: >
      CC_MD5 / Insecure.MD5 hash function detected. MD5 is
      cryptographically broken. Use SHA-256 or SHA-512 from CryptoKit or
      CommonCrypto for integrity and authentication.
    severity: ERROR
    languages: [swift]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: MD5
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: CC_MD5(...)
      - pattern: CC_MD5_Init(...)
      - pattern: CC_MD5_Update(...)
      - pattern: CC_MD5_Final(...)
      - pattern: Insecure.MD5.hash(...)

  - id: cbom-swift-insecure-hash-sha1
    message: >
      CC_SHA1 / Insecure.SHA1 hash function detected. SHA-1 is
      cryptographically weak. Use SHA-256 or SHA-512 from CryptoKit or
      CommonCrypto for integrity and authentication.
    severity: WARNING
    languages: [swift]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: SHA-1
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: CC_SHA1(...)
      - pattern: CC_SHA1_Init(...)
      - pattern: CC_SHA1_Update(...)
      - pattern: CC_SHA1_Final(...)
      - pattern: Insecure.SHA1.hash(...)

  - id: cbom-swift-weak-random
    message: >
      arc4random() or arc4random_uniform() used for generating
      cryptographic values. While arc4random uses a CSPRNG internally on
      modern platforms, prefer SecRandomCopyBytes() for explicit
      cryptographic random generation to signal intent and ensure
      portability.
    severity: WARNING
    languages: [swift]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: WEAK-PRNG
      confidence: medium
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: arc4random()
      - pattern: arc4random_uniform(...)
      - pattern: arc4random_buf(...)

  # ── CBOM Inventory Rules ──

  - id: cbom-swift-crypto-library-import
    message: Cryptographic framework import detected in Swift.
    severity: INFO
    languages: [swift]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-LIBRARY-IMPORT
      cbom-library: cryptokit-or-commoncrypto-or-swift-crypto
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: import CryptoKit
      - pattern: import CommonCrypto
      - pattern: import Crypto
