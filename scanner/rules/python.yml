rules:
  - id: cbom-python-hardcoded-key-cipher
    message: >
      Hardcoded cryptographic key flows into cipher initialization.
      Keys should be loaded from environment variables, key management
      systems, or secure vaults.
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive-from-metavar: $ALGO
      cbom-primitive-fallback: SYMMETRIC-KEY
      confidence: high
      quantum-relevant: false
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          $KEY = b"..."
          ...
          Cipher(algorithms.$ALGO($KEY), ...)
      - pattern: |
          $KEY = "..."
          ...
          Cipher(algorithms.$ALGO($KEY.encode(...)), ...)

  - id: cbom-python-hardcoded-iv
    message: >
      Static initialization vector (IV) used in cipher mode. IVs must
      be randomly generated for each encryption operation.
    severity: WARNING
    languages: [python]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive: INITIALIZATION-VECTOR
      confidence: high
      quantum-relevant: false
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          $IV = b"..."
          ...
          modes.CBC($IV)
      - pattern: |
          $IV = b"..."
          ...
          modes.GCM($IV)

  - id: cbom-python-hardcoded-hmac-key
    message: >
      Hardcoded key used in HMAC computation. HMAC keys should be
      stored securely and rotated regularly.
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive: HMAC
      confidence: high
      quantum-relevant: false
      maturity: experimental
      default_enabled: false
      noise_risk: high
    pattern: hmac.new(b"...", ...)

  - id: cbom-python-weak-pbkdf2-iterations
    message: >
      PBKDF2 iteration count is below the recommended minimum of
      100,000. Low iterations make brute-force attacks feasible.
    severity: WARNING
    languages: [python]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: PBKDF2
      confidence: medium
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - patterns:
          - pattern: hashlib.pbkdf2_hmac(..., ..., ..., iterations=$N)
          - metavariable-comparison:
              metavariable: $N
              comparison: $N < 100000
      - patterns:
          - pattern: |
              PBKDF2HMAC(
                ...,
                iterations=$N,
                ...
              )
          - metavariable-comparison:
              metavariable: $N
              comparison: $N < 100000

  - id: cbom-python-random-for-crypto
    message: >
      Python's random module is not cryptographically secure.
      Use secrets or os.urandom() for security-sensitive values.
    severity: WARNING
    languages: [python]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: WEAK-PRNG
      confidence: medium
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: random.random()
      - pattern: random.randint(...)
      - pattern: random.choice(...)

  # ── CBOM Inventory Rules ──

  - id: cbom-python-crypto-library-import
    message: >
      Cryptographic library import detected. Part of the project's
      cryptographic supply chain inventory.
    severity: INFO
    languages: [python]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-LIBRARY-IMPORT
      cbom-library: pyca-cryptography-or-hashlib-or-pycryptodome-or-pynacl
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: from cryptography import $X
      - pattern: from cryptography.hazmat.primitives import $X
      - pattern: from cryptography.hazmat.backends import $X
      - pattern: import hashlib
      - pattern: import hmac
      - pattern: import ssl
      - pattern: from Crypto import $X
      - pattern: from nacl import $X

  - id: cbom-python-deprecated-crypto-import
    message: >
      PyCrypto import detected. PyCrypto is unmaintained — consider
      migrating to pyca/cryptography or PyCryptodome.
    severity: WARNING
    languages: [python]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-LIBRARY-IMPORT
      cbom-library: pycrypto
      confidence: medium
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: from Crypto.Cipher import $X
      - pattern: from Crypto.PublicKey import $X
      - pattern: from Crypto.Hash import $X

  - id: cbom-python-kdf-to-cipher-chain-pbkdf2
    message: >
      Key derivation chain: PBKDF2HMAC output used as cipher key.
    severity: INFO
    languages: [python]
    metadata:
      category: inventory
      cbom-asset-type: key-derivation-function
      cbom-primitive: PBKDF2
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: |
      $KEY = PBKDF2HMAC(...).derive($PASSWORD)
      ...
      Cipher(algorithms.$ALGO($KEY), ...)

  - id: cbom-python-kdf-to-cipher-chain-scrypt
    message: >
      Key derivation chain: Scrypt output used as cipher key.
    severity: INFO
    languages: [python]
    metadata:
      category: inventory
      cbom-asset-type: key-derivation-function
      cbom-primitive: SCRYPT
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: |
      $KEY = Scrypt(...).derive($PASSWORD)
      ...
      Cipher(algorithms.$ALGO($KEY), ...)

  - id: cbom-python-tls-version-enforcement
    message: >
      TLS version enforcement detected via minimum_version setting.
    severity: INFO
    languages: [python]
    metadata:
      category: inventory
      cbom-asset-type: protocol
      cbom-primitive: TLS
      cbom-primitive-from-metavar: $VERSION
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: |
          $CTX = ssl.SSLContext(...)
          ...
          $CTX.minimum_version = ssl.TLSVersion.$VERSION

  - id: cbom-python-config-driven-algorithm
    message: >
      Algorithm name from environment used in crypto operation.
    severity: INFO
    languages: [python]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive-from-metavar: $ALGO
      cbom-primitive-fallback: CONFIG-DRIVEN-ALGORITHM
      confidence: medium
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: |
          $ALGO = os.environ.get("$KEY")
          ...
          hashlib.new($ALGO, ...)
      - pattern: |
          $ALGO = os.getenv("$KEY")
          ...
          hashlib.new($ALGO, ...)

  - id: cbom-python-cert-to-tls-context
    message: >
      Certificate loaded into SSL context. CBOM links certificate file
      to TLS configuration.
    severity: INFO
    languages: [python]
    metadata:
      category: inventory
      cbom-asset-type: certificate
      cbom-primitive: CERTIFICATE-X509
      confidence: high
      quantum-relevant: true
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: |
          $CTX = ssl.SSLContext(...)
          ...
          $CTX.load_cert_chain("$CERTFILE", ...)
      - pattern: |
          $CTX = ssl.SSLContext(...)
          ...
          $CTX.load_verify_locations("$CAFILE")

  - id: cbom-python-cert-validation-chain
    message: >
      Certificate validation configuration detected. CBOM records
      verification mode for compliance.
    severity: INFO
    languages: [python]
    metadata:
      category: inventory
      cbom-asset-type: certificate
      cbom-primitive: CERTIFICATE-X509
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: |
          $CTX = ssl.SSLContext(...)
          ...
          $CTX.verify_mode = ssl.CERT_REQUIRED

  - id: cbom-python-password-hash-inventory
    message: >
      Password hashing function detected. CBOM inventories the algorithm
      and cost parameters for credential storage.
    severity: INFO
    languages: [python]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: BCRYPT
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: bcrypt.hashpw($PASSWORD, bcrypt.gensalt($ROUNDS))
      - pattern: bcrypt.hashpw($PASSWORD, bcrypt.gensalt())

  # ── pyca per-algorithm cipher inventory (Phase A2) ──
  #
  # pyca/cryptography exposes ciphers as class objects (algorithms.TripleDES,
  # algorithms.ARC4, …) — the algorithm name never appears as a string, so
  # neither the metavar-driven nor the cipher-spec canonicalizer can recover
  # it. Per-class rules emit the specific primitive directly.

  - id: cbom-python-pyca-3des
    message: "3DES (TripleDES) cipher detected"
    severity: WARNING
    languages: [python]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: 3DES
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern: algorithms.TripleDES(...)

