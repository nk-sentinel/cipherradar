  # ── BouncyCastle / JCA hash algorithm inventory (Phase A1) ──
  #
  # Each rule names a specific hash primitive instead of relying on the
  # generic library-import rule, so the CBOM lists e.g. "MD2" not just
  # "CRYPTO-LIBRARY-IMPORT". Broken algorithms (MD2/MD4) keep severity
  # WARNING; legacy-but-not-broken digests are INFO inventory entries.
  #
  # Rule IDs use the "bc-" prefix (not "bouncycastle-") so the derived
  # component name doesn't collide with the BOUNCYCASTLE library token in
  # downstream bucket classification.

  - id: cbom-java-bc-md2
    message: "MD2 hash detected (broken)"
    severity: WARNING
    languages: [java]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: MD2
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: new MD2Digest(...)
      - pattern: MessageDigest.getInstance("MD2")

