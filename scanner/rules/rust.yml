rules:
  - id: cbom-rust-hardcoded-key
    message: >
      Hardcoded byte array flows into cipher key construction. Hardcoded
      keys are extractable from compiled binaries and should be loaded from
      environment variables or secret management systems.
    severity: ERROR
    languages: [rust]
    metadata:
      category: security
      cbom-asset-type: related-crypto-material
      cbom-primitive: SYMMETRIC-KEY
      confidence: high
      quantum-relevant: true
      maturity: experimental
      default_enabled: false
      noise_risk: high
    patterns:
      - pattern: |
          let $KEY: [u8; $N] = [...];
          ...
          Aes128::new(GenericArray::from_slice(&$KEY))
      - pattern: |
          let $KEY: [u8; $N] = [...];
          ...
          Aes256::new(GenericArray::from_slice(&$KEY))
      - pattern: |
          let $KEY = b"...";
          ...
          Aes128::new(GenericArray::from_slice($KEY))
      - pattern: |
          let $KEY = b"...";
          ...
          Aes256::new(GenericArray::from_slice($KEY))
      - pattern: |
          let $KEY: [u8; $N] = [...];
          ...
          ChaCha20Poly1305::new(GenericArray::from_slice(&$KEY))

  - id: cbom-rust-weak-tls
    message: >
      Insecure or deprecated cipher suite configured in rustls. Weak cipher
      suites enable downgrade attacks and may not provide forward secrecy.
      Use only TLS 1.3 suites or strong TLS 1.2 AEAD suites.
    severity: WARNING
    languages: [rust]
    metadata:
      category: security
      cbom-asset-type: protocol
      cbom-primitive: TLS
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: rustls::cipher_suite::TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA
      - pattern: rustls::cipher_suite::TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA
      - pattern: dangerous_configuration::DangerousClientConfig
      - pattern: $X.with_custom_certificate_verifier(...)

  - id: cbom-rust-deprecated-hash-md5
    message: >
      MD5 hash function detected. MD5 is cryptographically broken and
      must not be used for integrity or authentication. Use SHA-256,
      SHA-3, or BLAKE3 instead.
    severity: ERROR
    languages: [rust]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: MD5
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: md5::compute(...)
      - pattern: md5::Md5::digest(...)
      - pattern: Md5::new()
      - pattern: |
          use md5::Md5;

  - id: cbom-rust-deprecated-hash-sha1
    message: >
      SHA-1 hash function detected. SHA-1 is considered cryptographically
      weak. Use SHA-256, SHA-3, or BLAKE3 instead.
    severity: WARNING
    languages: [rust]
    metadata:
      category: security
      cbom-asset-type: algorithm
      cbom-primitive: SHA-1
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    patterns:
      - pattern: sha1::Sha1::digest(...)
      - pattern: Sha1::new()
      - pattern: |
          use sha1::Sha1;

  # ── CBOM Inventory Rules ──

  - id: cbom-rust-crypto-library-import
    message: Cryptographic crate import detected in Rust.
    severity: INFO
    languages: [rust]
    metadata:
      category: inventory
      cbom-asset-type: library
      cbom-primitive: CRYPTO-LIBRARY-IMPORT
      cbom-library: ring-or-rustls-or-openssl
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: use ring::$X;
      - pattern: use rustls::$X;
      - pattern: use openssl::$X;
      - pattern: use ring::$X::$Y;
      - pattern: use rustls::$X::$Y;
      - pattern: use openssl::$X::$Y;

  - id: cbom-rust-password-hash-inventory
    message: Password hashing detected in Rust.
    severity: INFO
    languages: [rust]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: BCRYPT
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: bcrypt::hash($PASSWORD, $COST)

  # ── GOST R 34.11 / Streebog hash (RustCrypto streebog & gost94 crates) ──
  #
  # Tied to the specific RustCrypto crate types (Streebog256/512, Gost94*),
  # so unrelated code is never matched. GOST hash is quantum-relevant: false.

  - id: cbom-rust-gost-streebog
    message: "GOST R 34.11 / Streebog hash detected"
    severity: INFO
    languages: [rust]
    metadata:
      category: inventory
      cbom-asset-type: algorithm
      cbom-primitive: GOST3411
      confidence: high
      quantum-relevant: false
      maturity: stable
      default_enabled: true
      noise_risk: low
    pattern-either:
      - pattern: streebog::Streebog256::new()
      - pattern: streebog::Streebog512::new()
      - pattern: Streebog256::new()
      - pattern: Streebog512::new()
      - pattern: streebog::Streebog256::digest(...)
      - pattern: streebog::Streebog512::digest(...)
      - pattern: |
          use streebog::Streebog256;
      - pattern: |
          use streebog::Streebog512;
      - pattern: gost94::Gost94CryptoPro::new()
      - pattern: gost94::Gost94Test::new()
      - pattern: |
          use gost94::Gost94CryptoPro;
