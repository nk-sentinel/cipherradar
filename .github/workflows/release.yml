name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Design note — no Actions artifact storage:
# Each build job uploads its archives DIRECTLY to the GitHub Release via
# softprops/action-gh-release. Release-attached assets do NOT count against
# the account's Actions storage quota, whereas upload-artifact/download-artifact
# do. The previous design relayed ~370 MB through Actions storage every release
# (retained 90 days by default) just to hand files between jobs — that filled
# the storage quota and blocked releases. Job graph:
#   create-release  -> build (matrix x3, appends archives) -> checksums
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate VERSION matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION | tr -d '[:space:]')"
          echo "Tag: ${TAG_VERSION}, VERSION file: ${FILE_VERSION}"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::VERSION file (${FILE_VERSION}) does not match tag (${TAG_VERSION}). Update VERSION before tagging."
            exit 1
          fi
        shell: bash

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: cli/go.sum

      # SCA gate — block the release if the CLI has any reachable vulnerability
      # (stdlib or dependency). Runs before the GitHub Release is created so a
      # vulnerable build is never published. govulncheck exits non-zero on
      # reachable vulns.
      - name: govulncheck (SCA release gate)
        working-directory: cli
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Assemble human-readable release notes. The "What's Changed" summary is
      # the curated, grouped section for this version from CHANGELOG.md — NOT the
      # auto-generated per-PR firehose (generate_release_notes is off below). The
      # CHANGELOG is the single source of truth; keep it current per release.
      - name: Assemble release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract this version's section: from its "## <version> …" heading up
          # to (but excluding) the next "## " heading. Literal prefix match — no
          # regex, so version metachars (. -) can't misbehave.
          awk -v ver="## ${VERSION}" '
            substr($0,1,length(ver))==ver && (substr($0,length(ver)+1,1)==" " || substr($0,length(ver)+1,1)=="") {flag=1; next}
            /^## / && flag {flag=0}
            flag {print}
          ' CHANGELOG.md > changelog-section.md
          if [ ! -s changelog-section.md ]; then
            echo "::warning::No CHANGELOG.md section found for ${VERSION}; release notes will omit the change summary. Add a '## ${VERSION}' section to CHANGELOG.md before tagging."
          fi
          {
            echo "## CipherRadar ${GITHUB_REF_NAME}"
            echo
            echo "### Downloads"
            echo
            echo "| Platform | Lightweight | Full (+ OpenGrep + YARA-X) |"
            echo "|---|---|---|"
            echo "| Linux x86_64 | \`cradar_*_linux_amd64.tar.gz\` | \`cradar-full_*_linux_amd64.tar.gz\` |"
            echo "| macOS ARM64 | \`cradar_*_darwin_arm64.tar.gz\` | \`cradar-full_*_darwin_arm64.tar.gz\` |"
            echo "| Windows x86_64 | \`cradar_*_windows_amd64.zip\` | \`cradar-full_*_windows_amd64.zip\` |"
            echo
            if [ -s changelog-section.md ]; then
              echo "## What's Changed"
              cat changelog-section.md
              echo
            fi
            echo "### Quick Start"
            echo '```bash'
            echo "# Download and extract"
            echo 'tar xzf cradar_*_$(uname -s | tr A-Z a-z)_$(uname -m).tar.gz'
            echo
            echo "# Scan a project"
            echo "./cradar scan /path/to/project --format text"
            echo
            echo "# Generate CycloneDX 1.7 CBOM"
            echo "./cradar scan /path/to/project --format cyclonedx-json --output cbom.json --validate"
            echo
            echo "# Install OpenGrep + YARA-X (if using lightweight)"
            echo "./cradar install-tools"
            echo '```'
            echo
            echo "### What's Included"
            echo "- **cradar** (lightweight, ~15 MB): 3-pass scanner (tree-sitter → OpenGrep → YARA-X; Pass 3 opt-in via \`--deep\`), 12 languages, CycloneDX 1.7 output"
            echo "- **cradar-full** (~55 MB): Same binary + OpenGrep + YARA-X pre-bundled for air-gapped environments"
            echo
            echo "\`checksums.txt\` (SHA-256 of every archive) is attached once all platform builds complete."
            echo
            echo "See [CHANGELOG](https://github.com/nk-sentinel/cipherradar/blob/main/CHANGELOG.md) for full details."
          } > RELEASE_NOTES.md
          echo "=== assembled release notes ==="
          cat RELEASE_NOTES.md
        shell: bash

      - name: Create the GitHub Release shell
        uses: softprops/action-gh-release@v2
        with:
          name: "CipherRadar ${{ github.ref_name }}"
          draft: false
          # Off by design: we ship a curated, grouped summary from CHANGELOG.md
          # instead of the per-PR auto list, which had grown too long to scan.
          generate_release_notes: false
          body_path: RELEASE_NOTES.md

  build:
    needs: create-release
    # Cap the leg so a stuck post-step (e.g. the setup-go cache save, which can
    # hang for many minutes on Windows) can't pin the run and block `checksums`.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds only — CGO (tree-sitter) prevents cross-compilation.
          # OpenGrep ships standalone single-file binaries at the release root
          # (no tarball); rc2 PR #5 switched the runtime installer to these
          # and this workflow follows. Note darwin/arm64 uses "arm64" not
          # "aarch64" (opengrep is inconsistent vs the manylinux variant).
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            opengrep_asset: opengrep_manylinux_x86
            yarax_asset: yara-x-v1.14.0-x86_64-unknown-linux-gnu.gz
            yarax_format: gz
          - os: macos-latest
            goos: darwin
            goarch: arm64
            opengrep_asset: opengrep_osx_arm64
            yarax_asset: yara-x-v1.14.0-aarch64-apple-darwin.gz
            yarax_format: gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            opengrep_asset: opengrep_windows_x86.exe
            yarax_asset: yara-x-v1.14.0-x86_64-pc-windows-msvc.zip
            yarax_format: zip
          # NOTE: macos-13 (Intel) runners are deprecated by GitHub.
          # darwin/amd64 dropped until a cross-compile or self-hosted solution is available.
          # NOTE: linux/arm64 requires a self-hosted ARM runner or
          # ubuntu-24.04-arm64 (GitHub-hosted ARM, if available).
          # Skipped for v1.0 — add when ARM runner is available.
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # Disable the Go build/module cache for release legs: the savings are
          # marginal for a one-shot build, and the post-job cache-save step is
          # slow and prone to hanging on Windows runners (it was pinning the
          # whole run after archives had already uploaded).
          cache: false

      - name: Run tests
        working-directory: cli
        shell: bash
        run: go test ./internal/scanner/java/... ./internal/scanner/python/... ./internal/scanner/javascript/... ./internal/scanner/golang/... ./internal/output/... ./internal/types/...

      - name: Build cradar binary
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          go generate ./internal/rules
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags "-s -w \
            -X github.com/nk-sentinel/cipherradar/cli/internal/cmd.Version=${GITHUB_REF_NAME#v} \
            -X github.com/nk-sentinel/cipherradar/cli/internal/cmd.Commit=${GITHUB_SHA::8} \
            -X github.com/nk-sentinel/cipherradar/cli/internal/cmd.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "../dist/cradar${EXT}" ./cmd/cradar
        shell: bash

      - name: Verify binary
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          dist/cradar${EXT} version
        shell: bash

      - name: Download OpenGrep for cradar-full
        if: matrix.opengrep_asset != ''
        run: |
          OPENGREP_VERSION="v1.16.5"
          DOWNLOAD_URL="https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/${{ matrix.opengrep_asset }}"
          echo "Downloading OpenGrep from: ${DOWNLOAD_URL}"
          mkdir -p dist/opengrep
          # OpenGrep ships standalone single-file binaries at the release root —
          # no archive to extract. Just download, chmod, and place.
          curl -fSL --retry 3 -o dist/opengrep/opengrep-bin "${DOWNLOAD_URL}"
          chmod +x dist/opengrep/opengrep-bin
          echo "OpenGrep binary: dist/opengrep/opengrep-bin ($(du -h dist/opengrep/opengrep-bin | cut -f1))"
        shell: bash

      - name: Download YARA-X for cradar-full
        if: matrix.yarax_asset != ''
        run: |
          YARAX_VERSION="v1.14.0"
          DOWNLOAD_URL="https://github.com/VirusTotal/yara-x/releases/download/${YARAX_VERSION}/${{ matrix.yarax_asset }}"
          echo "Downloading YARA-X from: ${DOWNLOAD_URL}"
          mkdir -p dist/yarax
          curl -fSL --retry 3 -o /tmp/yarax-archive "${DOWNLOAD_URL}"
          if [ "${{ matrix.yarax_format }}" = "zip" ]; then
            # Windows ships yr.exe inside a zip — extract and locate.
            unzip -o /tmp/yarax-archive -d dist/yarax/
            YARAX_BIN=$(find dist/yarax/ -type f \( -name 'yr' -o -name 'yr.exe' \) | head -1)
          else
            # YARA-X .gz files are GZIPPED TAR archives containing a single 'yr'
            # binary (not single-file gzip). Earlier workflow revisions assumed
            # single-file gzip and shipped the raw tar as if it were the binary;
            # the in-CI exec gate below now catches that class of bug.
            cd dist/yarax && gunzip -c /tmp/yarax-archive | tar -xf -
            cd "$GITHUB_WORKSPACE"
            YARAX_BIN=$(find dist/yarax/ -type f \( -name 'yr' -o -name 'yr.exe' \) | head -1)
          fi
          if [ -z "$YARAX_BIN" ]; then
            echo "::error::YARA-X binary not found after extraction for ${{ matrix.goos }}/${{ matrix.goarch }}"
            exit 1
          fi
          mv "$YARAX_BIN" dist/yarax/yr-bin
          chmod +x dist/yarax/yr-bin
          echo "YARA-X binary: dist/yarax/yr-bin ($(du -h dist/yarax/yr-bin | cut -f1))"
        shell: bash

      - name: Sanity-exec bundled tools (catches non-binary files shipping as binaries)
        if: matrix.opengrep_asset != ''
        run: |
          # OpenGrep
          file dist/opengrep/opengrep-bin
          case "${{ matrix.goos }}" in
            linux|darwin)
              dist/opengrep/opengrep-bin --version 2>&1 | head -3 || {
                echo "::error::OpenGrep binary at dist/opengrep/opengrep-bin does not execute on ${{ matrix.goos }}/${{ matrix.goarch }}"; exit 1; }
              ;;
            # Windows opengrep_windows_x86.exe is sanity-checked by file(1) only —
            # cross-OS exec on the actions runner host isn't useful.
          esac
          # YARA-X
          file dist/yarax/yr-bin
          case "${{ matrix.goos }}" in
            linux|darwin)
              dist/yarax/yr-bin --version 2>&1 | head -3 || {
                echo "::error::YARA-X binary at dist/yarax/yr-bin does not execute on ${{ matrix.goos }}/${{ matrix.goarch }}"; exit 1; }
              ;;
          esac
          echo "Bundled-tool sanity OK"
        shell: bash

      - name: Package cradar (lightweight)
        run: |
          mkdir -p dist/cradar-pkg
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          cp dist/cradar${EXT} dist/cradar-pkg/
          # Bundle docs and metadata (paths are relative to GITHUB_WORKSPACE,
          # so must run BEFORE the `cd dist/cradar-pkg` below).
          cp cli/LICENSE dist/cradar-pkg/
          cp CHANGELOG.md dist/cradar-pkg/
          cp .github/release-README.md dist/cradar-pkg/README.md
          mkdir -p dist/cradar-pkg/docs
          cp -r docs/guides/cli/* dist/cradar-pkg/docs/
          cd dist/cradar-pkg
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "../cradar_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" .
          else
            tar czf "../cradar_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" .
          fi
        shell: bash

      - name: Package cradar-full (with OpenGrep)
        if: matrix.opengrep_asset != ''
        run: |
          mkdir -p dist/cradar-full-pkg
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          cp dist/cradar${EXT} dist/cradar-full-pkg/

          # Bundle OpenGrep — must exist since this step only runs when opengrep_asset is set
          if [ -f dist/opengrep/opengrep-bin ]; then
            OGEXT=""
            if [ "${{ matrix.goos }}" = "windows" ]; then OGEXT=".exe"; fi
            cp dist/opengrep/opengrep-bin dist/cradar-full-pkg/opengrep${OGEXT}
            if [ "${{ matrix.goos }}" != "windows" ]; then
              chmod +x dist/cradar-full-pkg/opengrep
            fi
            echo "Bundled OpenGrep into cradar-full"
          else
            echo "::error::OpenGrep binary not found for ${{ matrix.goos }}/${{ matrix.goarch }}"
            exit 1
          fi

          # Bundle YARA-X
          if [ -f dist/yarax/yr-bin ]; then
            YREXT=""
            if [ "${{ matrix.goos }}" = "windows" ]; then YREXT=".exe"; fi
            cp dist/yarax/yr-bin dist/cradar-full-pkg/yr${YREXT}
            if [ "${{ matrix.goos }}" != "windows" ]; then
              chmod +x dist/cradar-full-pkg/yr
            fi
            echo "Bundled YARA-X into cradar-full"
          else
            echo "::error::YARA-X binary not found for ${{ matrix.goos }}/${{ matrix.goarch }}"
            exit 1
          fi

          # Bundle docs and metadata (paths are relative to GITHUB_WORKSPACE,
          # so must run BEFORE the `cd dist/cradar-full-pkg` below).
          cp cli/LICENSE dist/cradar-full-pkg/
          cp CHANGELOG.md dist/cradar-full-pkg/
          cp .github/release-README.md dist/cradar-full-pkg/README.md
          mkdir -p dist/cradar-full-pkg/docs
          cp -r docs/guides/cli/* dist/cradar-full-pkg/docs/

          # Verify full package contents
          echo "=== cradar-full package contents ==="
          ls -lh dist/cradar-full-pkg/

          cd dist/cradar-full-pkg
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "../cradar-full_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" .
          else
            tar czf "../cradar-full_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" .
          fi
        shell: bash

      - name: Verify archive sizes
        if: matrix.opengrep_asset != ''
        run: |
          echo "=== Archive sizes ==="
          ls -lh dist/cradar_* dist/cradar-full_*
          ARCHIVE_EXT="tar.gz"
          if [ "${{ matrix.goos }}" = "windows" ]; then ARCHIVE_EXT="zip"; fi
          SLIM_SIZE=$(stat -f%z "dist/cradar_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.${ARCHIVE_EXT}" 2>/dev/null || stat -c%s "dist/cradar_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.${ARCHIVE_EXT}")
          FULL_SIZE=$(stat -f%z "dist/cradar-full_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.${ARCHIVE_EXT}" 2>/dev/null || stat -c%s "dist/cradar-full_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.${ARCHIVE_EXT}")
          echo "Slim: ${SLIM_SIZE} bytes, Full: ${FULL_SIZE} bytes"
          if [ "$FULL_SIZE" -le "$SLIM_SIZE" ]; then
            echo "::error::cradar-full archive ($FULL_SIZE) is not larger than slim ($SLIM_SIZE) — OpenGrep not bundled correctly"
            exit 1
          fi
          echo "Size check passed: full is $(( FULL_SIZE - SLIM_SIZE )) bytes larger"
        shell: bash

      # Upload this platform's archives DIRECTLY to the GitHub Release.
      # No actions/upload-artifact -> no Actions storage consumed. The release
      # shell was already created by the create-release job; this appends files.
      - name: Attach archives to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/cradar_*
            dist/cradar-full_*

  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release download + upload need write on Releases
    steps:
      # actions/checkout sets up the git auth helper that newer gh CLI versions
      # rely on; without it, gh release download fails with `401 Bad credentials`
      # even when GH_TOKEN is set. Don't fetch any history — we just need the
      # auth context.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      # Pull the just-published archives back from the Release (not from Actions
      # storage) via `gh release download`, hash them, attach checksums.txt.
      # If `gh release download` ever 401s again, the curl fallback below is the
      # bulletproof equivalent — uncomment instead:
      #   curl -fSL -H "Authorization: Bearer $GITHUB_TOKEN" \
      #        -H "Accept: application/octet-stream" \
      #        "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/<id>" \
      #        -o <file>
      - name: Generate and attach checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          cd dist
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'cradar_*' --pattern 'cradar-full_*'
          echo "=== Release archives ==="
          ls -lh
          sha256sum cradar_* cradar-full_* > checksums.txt
          echo "=== Checksums ==="
          cat checksums.txt
          gh release upload "${GITHUB_REF_NAME}" checksums.txt \
            --repo "${GITHUB_REPOSITORY}" --clobber
