name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds only — CGO (tree-sitter) prevents cross-compilation
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            opengrep_asset: opengrep-core_linux_x86.tar.gz
            opengrep_format: tar.gz
            yarax_asset: yara-x-v1.14.0-x86_64-unknown-linux-gnu.gz
            yarax_format: gz
          - os: macos-latest
            goos: darwin
            goarch: arm64
            opengrep_asset: opengrep-core_osx_aarch64.tar.gz
            opengrep_format: tar.gz
            yarax_asset: yara-x-v1.14.0-aarch64-apple-darwin.gz
            yarax_format: gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            opengrep_asset: opengrep-core_windows_x86.zip
            opengrep_format: zip
            yarax_asset: yara-x-v1.14.0-x86_64-pc-windows-msvc.zip
            yarax_format: zip
          # NOTE: macos-13 (Intel) runners are deprecated by GitHub.
          # darwin/amd64 dropped until a cross-compile or self-hosted solution is available.
          # NOTE: linux/arm64 requires a self-hosted ARM runner — skipped for v0.1.
          # NOTE: linux/arm64 requires a self-hosted ARM runner or
          # ubuntu-24.04-arm64 (GitHub-hosted ARM, if available).
          # Skipped for v1.0 — add when ARM runner is available.
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate VERSION matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION | tr -d '[:space:]')"
          echo "Tag: ${TAG_VERSION}, VERSION file: ${FILE_VERSION}"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::VERSION file (${FILE_VERSION}) does not match tag (${TAG_VERSION}). Update VERSION before tagging."
            exit 1
          fi
        shell: bash

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests
        working-directory: cli
        shell: bash
        run: go test ./internal/scanner/java/... ./internal/scanner/python/... ./internal/scanner/javascript/... ./internal/scanner/golang/... ./internal/output/... ./internal/types/...

      - name: Build cradar binary
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          go generate ./internal/rules
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags "-s -w \
            -X github.com/nk-sentinel/cipherradar/cli/internal/cmd.Version=${GITHUB_REF_NAME#v} \
            -X github.com/nk-sentinel/cipherradar/cli/internal/cmd.Commit=${GITHUB_SHA::8} \
            -X github.com/nk-sentinel/cipherradar/cli/internal/cmd.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "../dist/cradar${EXT}" ./cmd/cradar
        shell: bash

      - name: Verify binary
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          dist/cradar${EXT} version
        shell: bash

      - name: Download OpenGrep for cradar-full
        if: matrix.opengrep_asset != ''
        run: |
          OPENGREP_VERSION="v1.16.5"
          DOWNLOAD_URL="https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/${{ matrix.opengrep_asset }}"
          echo "Downloading OpenGrep from: ${DOWNLOAD_URL}"
          mkdir -p dist/opengrep
          curl -fSL --retry 3 -o /tmp/opengrep-archive "${DOWNLOAD_URL}"
          if [ "${{ matrix.opengrep_format }}" = "zip" ]; then
            unzip -o /tmp/opengrep-archive -d dist/opengrep/
          else
            tar -xzf /tmp/opengrep-archive -C dist/opengrep/
          fi
          echo "=== Extracted OpenGrep contents ==="
          find dist/opengrep/ -type f | head -20
          # Locate the actual binary (tarball structure varies by platform)
          OPENGREP_BIN=$(find dist/opengrep/ -type f \( -name 'opengrep-core' -o -name 'opengrep-core.exe' -o -name 'opengrep' -o -name 'opengrep.exe' \) | head -1)
          if [ -z "$OPENGREP_BIN" ]; then
            echo "::error::OpenGrep binary not found after extraction for ${{ matrix.goos }}/${{ matrix.goarch }}"
            exit 1
          fi
          # Normalize: move to a known location
          mv "$OPENGREP_BIN" dist/opengrep/opengrep-bin
          chmod +x dist/opengrep/opengrep-bin
          echo "OpenGrep binary: dist/opengrep/opengrep-bin ($(du -h dist/opengrep/opengrep-bin | cut -f1))"
        shell: bash

      - name: Download YARA-X for cradar-full
        if: matrix.yarax_asset != ''
        run: |
          YARAX_VERSION="v1.14.0"
          DOWNLOAD_URL="https://github.com/VirusTotal/yara-x/releases/download/${YARAX_VERSION}/${{ matrix.yarax_asset }}"
          echo "Downloading YARA-X from: ${DOWNLOAD_URL}"
          mkdir -p dist/yarax
          curl -fSL --retry 3 -o /tmp/yarax-archive "${DOWNLOAD_URL}"
          if [ "${{ matrix.yarax_format }}" = "zip" ]; then
            unzip -o /tmp/yarax-archive -d dist/yarax/
          else
            # YARA-X .gz archives are gzipped tars containing the 'yr' binary
            gunzip -c /tmp/yarax-archive | tar -xf - -C dist/yarax/
          fi
          echo "=== Extracted YARA-X contents ==="
          find dist/yarax/ -type f | head -20
          # Locate the yr binary
          YARAX_BIN=$(find dist/yarax/ -type f \( -name 'yr' -o -name 'yr.exe' \) | head -1)
          if [ -z "$YARAX_BIN" ]; then
            echo "::error::YARA-X binary not found after extraction for ${{ matrix.goos }}/${{ matrix.goarch }}"
            exit 1
          fi
          mv "$YARAX_BIN" dist/yarax/yr-bin
          chmod +x dist/yarax/yr-bin
          echo "YARA-X binary: dist/yarax/yr-bin ($(du -h dist/yarax/yr-bin | cut -f1))"
        shell: bash

      - name: Package cradar (lightweight)
        run: |
          mkdir -p dist/cradar-pkg
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          cp dist/cradar${EXT} dist/cradar-pkg/
          cd dist/cradar-pkg
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "../cradar_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" .
          else
            tar czf "../cradar_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" .
          fi
        shell: bash

      - name: Package cradar-full (with OpenGrep)
        if: matrix.opengrep_asset != ''
        run: |
          mkdir -p dist/cradar-full-pkg
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          cp dist/cradar${EXT} dist/cradar-full-pkg/

          # Bundle OpenGrep — must exist since this step only runs when opengrep_asset is set
          if [ -f dist/opengrep/opengrep-bin ]; then
            OGEXT=""
            if [ "${{ matrix.goos }}" = "windows" ]; then OGEXT=".exe"; fi
            cp dist/opengrep/opengrep-bin dist/cradar-full-pkg/opengrep${OGEXT}
            if [ "${{ matrix.goos }}" != "windows" ]; then
              chmod +x dist/cradar-full-pkg/opengrep
            fi
            echo "Bundled OpenGrep into cradar-full"
          else
            echo "::error::OpenGrep binary not found for ${{ matrix.goos }}/${{ matrix.goarch }}"
            exit 1
          fi

          # Bundle YARA-X
          if [ -f dist/yarax/yr-bin ]; then
            YREXT=""
            if [ "${{ matrix.goos }}" = "windows" ]; then YREXT=".exe"; fi
            cp dist/yarax/yr-bin dist/cradar-full-pkg/yr${YREXT}
            if [ "${{ matrix.goos }}" != "windows" ]; then
              chmod +x dist/cradar-full-pkg/yr
            fi
            echo "Bundled YARA-X into cradar-full"
          else
            echo "::warning::YARA-X binary not found — cradar-full will not include binary scanning"
          fi

          # Verify full package contents
          echo "=== cradar-full package contents ==="
          ls -lh dist/cradar-full-pkg/

          cd dist/cradar-full-pkg
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "../cradar-full_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" .
          else
            tar czf "../cradar-full_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" .
          fi
        shell: bash

      - name: Verify archive sizes
        if: matrix.opengrep_asset != ''
        run: |
          echo "=== Archive sizes ==="
          ls -lh dist/cradar_* dist/cradar-full_*
          ARCHIVE_EXT="tar.gz"
          if [ "${{ matrix.goos }}" = "windows" ]; then ARCHIVE_EXT="zip"; fi
          SLIM_SIZE=$(stat -f%z "dist/cradar_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.${ARCHIVE_EXT}" 2>/dev/null || stat -c%s "dist/cradar_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.${ARCHIVE_EXT}")
          FULL_SIZE=$(stat -f%z "dist/cradar-full_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.${ARCHIVE_EXT}" 2>/dev/null || stat -c%s "dist/cradar-full_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.${ARCHIVE_EXT}")
          echo "Slim: ${SLIM_SIZE} bytes, Full: ${FULL_SIZE} bytes"
          if [ "$FULL_SIZE" -le "$SLIM_SIZE" ]; then
            echo "::error::cradar-full archive ($FULL_SIZE) is not larger than slim ($SLIM_SIZE) — OpenGrep not bundled correctly"
            exit 1
          fi
          echo "Size check passed: full is $(( FULL_SIZE - SLIM_SIZE )) bytes larger"
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/cradar_*
            dist/cradar-full_*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum cradar_* cradar-full_* > checksums.txt
          echo "=== Release Artifacts ==="
          ls -lh cradar_* cradar-full_*
          echo ""
          echo "=== Checksums ==="
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CipherRadar ${{ github.ref_name }}"
          draft: false
          generate_release_notes: true
          body: |
            ## CipherRadar ${{ github.ref_name }}

            ### Downloads

            | Platform | Lightweight | Full (+ OpenGrep + YARA-X) |
            |---|---|---|
            | Linux x86_64 | `cradar_*_linux_amd64.tar.gz` | `cradar-full_*_linux_amd64.tar.gz` |
            | macOS ARM64 | `cradar_*_darwin_arm64.tar.gz` | `cradar-full_*_darwin_arm64.tar.gz` |
            | Windows x86_64 | `cradar_*_windows_amd64.zip` | `cradar-full_*_windows_amd64.zip` |

            ### Quick Start
            ```bash
            # Download and extract
            tar xzf cradar_*_$(uname -s | tr A-Z a-z)_$(uname -m).tar.gz

            # Scan a project
            ./cradar scan /path/to/project --format text

            # Generate CycloneDX 1.7 CBOM
            ./cradar scan /path/to/project --format cyclonedx-json --output cbom.json --validate

            # Install OpenGrep + YARA-X (if using lightweight)
            ./cradar install-tools
            ```

            ### What's Included
            - **cradar** (lightweight, ~15 MB): 2-pass scanner (tree-sitter + OpenGrep), 12+ languages, CycloneDX 1.7 output
            - **cradar-full** (~55 MB): Same binary + OpenGrep + YARA-X pre-bundled for air-gapped environments

            See [CHANGELOG](https://github.com/nk-sentinel/cipherradar/blob/main/CHANGELOG.md) for full details.
          files: |
            dist/cradar_*
            dist/cradar-full_*
            dist/checksums.txt
