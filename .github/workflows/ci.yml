name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # Always pull the newest 1.26.x patch so the govulncheck security gate
          # sees the latest stdlib fixes (e.g. go1.26.5 fixes GO-2026-5856).
          check-latest: true
          cache-dependency-path: cli/go.sum

      - name: Go vet
        working-directory: cli
        run: go vet ./...

      - name: Run tests
        working-directory: cli
        run: |
          go test -race -count=1 \
            ./internal/scanner/java/... \
            ./internal/scanner/python/... \
            ./internal/scanner/javascript/... \
            ./internal/scanner/golang/... \
            ./internal/scanner/kotlin/... \
            ./internal/scanner/csharp/... \
            ./internal/scanner/php/... \
            ./internal/scanner/ruby/... \
            ./internal/scanner/rust/... \
            ./internal/scanner/swift/... \
            ./internal/scanner/dart/... \
            ./internal/scanner/cpp/... \
            ./internal/scanner/kdf/... \
            ./internal/scanner/binary/... \
            ./internal/scanner/configfile/... \
            ./internal/scanner/custom/... \
            ./internal/output/... \
            ./internal/types/... \
            ./internal/validation/... \
            ./internal/tools/...

      - name: Build cradar
        working-directory: cli
        run: |
          go generate ./internal/rules
          go build -o cradar ./cmd/cradar
          ./cradar version

      - name: Smoke test scan
        working-directory: cli
        run: |
          ./cradar scan ../scanner/rules/ --format text --passes 1 | head -20

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # Always pull the newest 1.26.x patch so the govulncheck security gate
          # sees the latest stdlib fixes (e.g. go1.26.5 fixes GO-2026-5856).
          check-latest: true
          cache-dependency-path: cli/go.sum

      # SCA — hard gate. govulncheck does reachability analysis over the build
      # graph (stdlib + modules) and exits non-zero on any *reachable*
      # vulnerability, so a CLI with a known-exploitable dependency/stdlib vuln
      # cannot pass CI (or, via the same step in release.yml, be released).
      - name: govulncheck (SCA)
        working-directory: cli
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # SAST (#74). testdata/ is excluded — fixtures intentionally contain weak
      # crypto. Two runs share one install:
      #   1. advisory — surfaces MEDIUM/LOW (mostly inherent to a file-scanning,
      #      tool-shelling CLI: G304 path reads, G204 exec, WalkDir); never fails.
      #   2. gate — fails CI on any HIGH. The current HIGHs are false-positives
      #      (exec.Command no-shell, stat on operator-controlled tool paths,
      #      WalkDir on cradar-owned trees) annotated with justified `#nosec`, so
      #      this catches a genuinely new HIGH pattern without the annotate-every-
      #      file-read treadmill an all-severity gate would impose. govulncheck
      #      (above) remains the hard gate for known-exploitable dependency CVEs.
      - name: gosec (SAST)
        working-directory: cli
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "::group::gosec advisory (all severities)"
          gosec -quiet -exclude-dir=testdata ./... || echo "::warning::gosec reported advisory (MEDIUM/LOW) findings — see log"
          echo "::endgroup::"
          echo "gosec gate: failing only on HIGH severity"
          gosec -quiet -exclude-dir=testdata -severity=high ./...

  validate-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate OpenGrep YAML rules
        run: |
          pip install pyyaml
          for f in scanner/rules/*.yml; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" && echo "OK: $f" || exit 1
          done

      - name: Check no duplicate rule IDs
        run: |
          DUPES=$(grep -h "^  - id:" scanner/rules/*.yml | sed 's/^  - id: //' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "Duplicate rule IDs found:"
            echo "$DUPES"
            exit 1
          fi
          echo "No duplicate rule IDs"

      - name: Verify embedded rules are in sync
        run: |
          # Compare source-of-truth rules against CLI embedded copy
          DIFF=$(diff -rq scanner/rules/ cli/internal/rules/data/ 2>&1) || true
          if [ -n "$DIFF" ]; then
            echo "::error::Embedded rules are out of sync with scanner/rules/"
            echo "$DIFF"
            echo ""
            echo "Fix: cd cli && go generate ./internal/rules && commit the updated data/ files"
            exit 1
          fi
          echo "Embedded rules are in sync"
